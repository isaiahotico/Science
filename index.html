<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="//libtl.com/sdk.js" data-zone="10555663" data-sdk="show_10555663"></script>
    <title>Sampaguita Mining</title>
</head>
<body class="bg-gray-100 p-4">
    <div id="app" class="max-w-md mx-auto">
        <h1 class="text-xl font-bold text-center">Sampaguita Miner</h1>
        <div class="bg-white p-4 rounded shadow mt-4">
            <p>Balance: ₱<span id="balance">0.00</span></p>
            <p>User ID: <span id="uid">Loading...</span></p>
        </div>

        <div class="mt-4" id="mining-ui">
            <button onclick="buySampaguita()" class="w-full bg-green-500 text-white p-3 rounded">Buy Sampaguita (Watch Ad)</button>
            <div id="plants-container" class="mt-4"></div>
        </div>

        <div class="mt-8 p-4 bg-blue-100 rounded">
            <h2 class="font-bold">Referrals</h2>
            <p>Code: <span id="ref-code"></span></p>
            <input type="text" id="ref-input" placeholder="Enter Ref Code" class="border p-1">
            <button onclick="applyReferral()">Apply</button>
        </div>

        <div class="mt-8">
            <input type="number" id="wd-amount" placeholder="Min 1.00" class="border p-1 w-full">
            <button onclick="requestWithdrawal()" class="bg-purple-500 text-white w-full mt-2">Withdraw</button>
        </div>

        <div id="footer" class="text-center text-xs mt-10"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
