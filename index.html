<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC - TOP CHAT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag Ads -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>

    <style>
        :root { --p: #f1c40f; --s: #27ae60; --a: #e67e22; --bg: #fffdf2; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--dark); overflow-x: hidden;}
        .header { background: var(--p); padding: 10px; text-align: center; border-bottom: 3px solid #d4ac0d; position: sticky; top: 0; z-index: 1000; }
        .balance-box { font-size: 1.5rem; font-weight: 900; color: #1e8449; }
        .container { padding: 10px; max-width: 500px; margin: auto; }
        .page { display: none; text-align: center; }
        .active { display: block; }
        .btn { background: var(--a); color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-size: 1rem; font-weight: bold; margin: 6px 0; cursor: pointer; box-shadow: 0 4px #a04000; }
        .btn:disabled { background: #bdc3c7; box-shadow: none; opacity: 0.8; }
        
        /* Chat Styling */
        .chat-room { background: white; padding: 15px; border-radius: 15px; border: 2px solid var(--p); margin: 10px 0; cursor: pointer; }
        #chatMessages { height: 45vh; overflow-y: auto; background: white; border: 2px solid var(--p); border-radius: 12px; padding: 10px; margin-bottom: 10px; text-align: left; }
        .msg { margin-bottom: 8px; padding: 8px; border-radius: 8px; background: #f0f0f0; border: 1px solid #ddd; }
        .msg-u { font-weight: bold; color: var(--s); }
        
        .card { background: white; padding: 15px; border-radius: 15px; border: 2px solid var(--p); margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: center; }
        input { width: 80%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; }        .footer { font-size: 0.7rem; color: #7f8c8d; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div id="userBar">👤 @...</div>
        <div class="balance-box">₱ <span id="balance">0.000</span></div>
    </div>

    <div class="container">
        <!-- Home -->
        <div id="homePage" class="page active">
            <h1>🍍 PAPERHOUSE INC</h1>
            <button class="btn" onclick="nav('adsArea')">🍍 ADS AREA 🍍</button>
            <button class="btn" onclick="nav('signInArea')">🍍 Sign In 🍍</button>
            <button class="btn" style="background:#8e44ad" onclick="nav('refPage')">👥 Referral System 👥</button>
            <button class="btn" style="background:#1abc9c" onclick="nav('chatListPage')">💬 Top Chat Rooms 💬</button>
            <button class="btn" style="background:#2980b9" onclick="nav('withdrawPage')">💸 Withdraw Money 💸</button>
            <p onclick="adminLogin()" style="color:#ccc; font-size:0.6rem; margin-top:20px;">Owner Dashboard</p>
        </div>

        <!-- Chat Room Selection -->
        <div id="chatListPage" class="page">
            <button class="btn" onclick="nav('homePage')">Back</button>
            <h3>Select a Room</h3>
            <div id="roomsContainer"></div>
        </div>

        <!-- Actual Chat Room -->
        <div id="chatRoomPage" class="page">
            <button class="btn" onclick="nav('chatListPage')">Exit Room</button>
            <h3 id="roomTitle">Room</h3>
            <div id="chatMessages"></div>
            <input type="text" id="chatInput" placeholder="Write a message...">
            <button class="btn" style="background:var(--s)" onclick="sendMsg()">Send Message</button>
        </div>

        <!-- Referral -->
        <div id="refPage" class="page">
            <button class="btn" onclick="nav('homePage')">Back</button>
            <div class="card">
                <p>Your Code: <strong id="myCode" style="color:var(--a)">--</strong></p>
                <div id="refInputSection">
                    <input type="text" id="refInput" placeholder="Enter Invite Code">
                    <button class="btn" style="width:50%" onclick="setInviter()">Save</button>
                </div>
            </div>
            <div class="card">
                <h3>Invites: <span id="refCount">0</span></h3>
                <h3>Bonus: ₱<span id="refBonus">0.00</span></h3>
                <button class="btn" style="background:var(--s)" onclick="claimBonus()">Claim to Main Balance</button>
            </div>
        </div>

        <!-- Withdrawal -->
        <div id="withdrawPage" class="page">
            <button class="btn" onclick="nav('homePage')">Back</button>
            <div class="card">
                <input type="number" id="wAmt" placeholder="Min 1 PHP">
                <input type="text" id="wTarget" placeholder="GCash Number">
                <button class="btn" onclick="requestW()">Withdraw</button>
            </div>
            <h4>History</h4>
            <table>
                <thead><tr><th>Date</th><th>Amt</th><th>Status</th></tr></thead>
                <tbody id="wHistoryBody"></tbody>
            </table>
        </div>

        <!-- Ads Areas (Simplified for brevity) -->
        <div id="adsArea" class="page"><button class="btn" onclick="nav('homePage')">Back</button><div id="adsList"></div></div>
        <div id="signInArea" class="page"><button class="btn" onclick="nav('homePage')">Back</button><div id="signInList"></div></div>

        <!-- Admin -->
        <div id="adminPage" class="page">
            <button class="btn" onclick="nav('homePage')">Exit</button>
            <h3>Admin Panel</h3>
            <div id="adminReqs"></div>
        </div>

        <div class="footer">© PAPERHOUSE INC</div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
