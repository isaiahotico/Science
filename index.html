<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAPERHOUSE INC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>

    <style>
        :root { --p: #2c3e50; --a: #f1c40f; --s: #27ae60; --d: #e74c3c; --bg: #f8f9fa; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; text-align: center; user-select: none; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 10px; }
        #userBar { background: var(--p); color: white; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 0.9em; margin-bottom: 10px; }
        #balanceDisplay { font-size: 2em; color: var(--s); font-weight: 800; margin: 5px 0; }
        .btn { border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin: 4px 0; font-size: 1em; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-main { background: var(--a); color: var(--p); }
        .btn-claim { background: #e67e22; color: white; display: none; }
        .hidden { display: none; }
        .cooldown { color: var(--d); font-size: 0.8em; font-weight: bold; }
        table { width: 100%; font-size: 0.75em; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: left; }
        .status-Paid { color: var(--s); font-weight: bold; }
        .status-Denied { color: var(--d); }
        input, select { width: 95%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 1em; }
    </style>
</head>
<body>

    <div id="userBar">👤 <span id="u-name">...</span> | ID: <span id="u-id">...</span></div>
    
    <div class="card">
        <div style="font-size: 0.8em; color: #7f8c8d;">AVAILABLE BALANCE</div>
        <div id="balanceDisplay">₱0.000</div>
        <div style="color: #34495e; font-size: 0.85em; font-weight: bold;">            My Code: <span id="my-code" style="color:var(--d)">------</span>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div id="page-main">
        <button class="btn btn-main" onclick="go('page-ads')">🍍 ADS AREA 🍍</button>
        <button class="btn btn-main" onclick="go('page-signin')">🍍 Paper house Sign In 🍍</button>
        <button class="btn btn-main" onclick="go('page-gifts')">🍍 Paper house Gift 🍍</button>
        <button class="btn" style="background:#3498db; color:white;" onclick="go('page-referral')">👥 REFERRALS (10%)</button>
        <button class="btn" style="background:var(--s); color:white;" onclick="go('page-withdraw')">💸 WITHDRAW</button>
        <button class="btn" style="background:#95a5a6; color:white;" onclick="go('page-admin')">⚙️ ADMIN PANEL</button>
    </div>

    <!-- AREA PAGES -->
    <div id="page-ads" class="hidden">
        <button onclick="go('page-main')">⬅️ Back</button>
        <h3>ADS AREA (₱0.02)</h3>
        <div id="list-ads"></div>
    </div>

    <div id="page-signin" class="hidden">
        <button onclick="go('page-main')">⬅️ Back</button>
        <h3>SIGN IN (₱0.025)</h3>
        <div id="list-signin"></div>
    </div>

    <div id="page-gifts" class="hidden">
        <button onclick="go('page-main')">⬅️ Back</button>
        <h3>GIFTS (₱0.02)</h3>
        <div id="list-gifts"></div>
    </div>

    <div id="page-referral" class="hidden">
        <button onclick="go('page-main')">⬅️ Back</button>
        <div class="card">
            <h4>Invite Friends</h4>
            <p>Earn 10% of their earnings forever!</p>
            <input type="number" id="ref-input" placeholder="Enter 6-Digit Code">
            <button class="btn btn-main" onclick="bindRef()">Apply Referrer</button>
        </div>
    </div>

    <div id="page-withdraw" class="hidden">
        <button onclick="go('page-main')">⬅️ Back</button>
        <div class="card">
            <input type="number" id="wd-amt" placeholder="Amount (₱)">
            <input type="text" id="wd-addr" placeholder="GCash No / Faucet Email">
            <select id="wd-method">
                <option value="GCash">GCash</option>
                <option value="FaucetPay">FaucetPay (USDT)</option>
            </select>
            <button class="btn btn-main" onclick="requestWD()">Withdraw Now</button>
        </div>
        <h4>Status Table</h4>
        <div id="wd-history" style="overflow-x:auto"></div>
    </div>

    <div id="page-admin" class="hidden">
        <button onclick="go('page-main')">⬅️ Back</button>
        <h3>Admin Controls</h3>
        <div id="admin-table" style="overflow-x:auto"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
