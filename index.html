<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global YouTube Random Sync</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
.container{max-width:720px;margin:auto;padding:14px}
#userBar{font-weight:bold;margin-bottom:10px}
input,button{padding:10px;border-radius:10px;border:none}
button{background:#22c55e;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{padding:8px;border-bottom:1px solid #334155}
</style>
</head>

<body>
<div class="container">

<div id="userBar">👤 Loading user...</div>

<div id="player"></div>

<br>

<input id="ytUrl" placeholder="Paste YouTube URL" style="width:100%">
<br><br>

<button onclick="addVideo()">➕ Add</button>
<button onclick="nextRandom()">🎲 Next (Random)</button>

<table>
<thead>
<tr><th>#</th><th>Video ID</th><th>Play</th></tr>
</thead>
<tbody id="playlist"></tbody>
</table>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
