<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { --gold: #ffd700; --green: #2ecc71; --dark: #121212; --card: #1e1e1e; }
        body { font-family: sans-serif; background: var(--dark); color: white; margin: 0; padding: 15px; text-align: center; }
        .header { background: var(--card); padding: 15px; border-radius: 12px; border-bottom: 2px solid var(--gold); margin-bottom: 15px; }
        h1 { color: var(--gold); margin: 0; font-size: 1.4rem; letter-spacing: 2px; }
        .user-bar { color: #0088cc; font-size: 0.9rem; margin: 5px 0; }
        .stat-line { font-size: 0.7rem; color: #aaa; }
        .balance-display { font-size: 2.2rem; color: var(--green); font-weight: bold; margin: 5px 0; }
        
        button { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--gold); color: black; }
        .btn-task { background: var(--green); color: white; }
        .btn-claim { background: #3498db; color: white; }
        .btn-withdraw { background: #e74c3c; color: white; }
        
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .hidden { display: none; }
        .cooldown { font-size: 0.8rem; color: #ff7675; }
        
        input { width: 90%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #444; background: #222; color: white; }
        table { width: 100%; font-size: 10px; margin-top: 10px; border-collapse: collapse; }
        th, td { border: 1px solid #333; padding: 8px; text-align: left; }
        .status-Paid { color: var(--green); }
        .status-Pending { color: var(--gold); }
        .status-Denied { color: #ff7675; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .page-btn { width: auto; padding: 5px 10px; font-size: 10px; }
    </style></head>
<body>

<div class="header">
    <h1>PAPERHOUSE INC</h1>
    <div id="userDisplay" class="user-bar">👤 Loading...</div>
    <div class="stat-line">GLOBAL WITHDRAWN: ₱<span id="globalWithdrawn">0.00</span></div>
    <div class="balance-display">₱<span id="balance">0.000</span></div>
</div>

<!-- MAIN PAGE -->
<div id="page-main">
    <button class="btn-main" onclick="navTo('page-ads')">🍍ADS AREA🍍</button>
    <button class="btn-main" onclick="navTo('page-signin')">🍍Paper house Sign In🍍</button>
    <button class="btn-main" onclick="navTo('page-gift')">🍍Paper house Gift🍍</button>
    <button class="btn-withdraw" onclick="navTo('page-withdraw')">Withdraw your Money here</button>
    <button style="background:#444; color:#ccc; font-size:10px" onclick="openAdmin()">Owner Dashboard</button>
</div>

<!-- SECTION TEMPLATE (Ads, Signin, Gift) -->
<div id="page-ads" class="hidden section-page">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div id="container-ads"></div>
</div>

<div id="page-signin" class="hidden section-page">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div id="container-signin"></div>
</div>

<div id="page-gift" class="hidden section-page">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div id="container-gift"></div>
</div>

<!-- WITHDRAW PAGE -->
<div id="page-withdraw" class="hidden">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div class="card">
        <h3>Withdrawal Request</h3>
        <input type="number" id="gcashNum" placeholder="GCash Number">
        <button class="btn-task" onclick="requestWithdraw('GCash')">Withdraw via GCash</button>
        <hr style="border:0.5px solid #333">
        <input type="email" id="fpayEmail" placeholder="FaucetPay Email">
        <button class="btn-task" onclick="requestWithdraw('FaucetPay')">Withdraw via FaucetPay</button>
    </div>
    <h4>Your History</h4>
    <table id="userHist">
        <thead><tr><th>Date</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody id="userHistBody"></tbody>
    </table>
    <div class="pagination" id="userPager"></div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="page-admin" class="hidden">
    <button onclick="navTo('page-main')">Logout Admin</button>
    <h3>Owner Management</h3>
    <table>
        <thead><tr><th>User</th><th>Amount</th><th>Method/Info</th><th>Action</th></tr></thead>
        <tbody id="adminBody"></tbody>
    </table>
    <div class="pagination" id="adminPager"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
