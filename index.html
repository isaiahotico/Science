<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampaguita Miner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
</head>
<body class="bg-gray-100 pb-20">
    <div id="app" class="max-w-md mx-auto p-4">
        <!-- Header -->
        <div class="bg-white p-4 rounded-xl shadow mb-4">
            <h1 class="text-xl font-bold">Sampaguita Garden</h1>
            <p>User ID: <span id="uid">Loading...</span></p>
            <p class="text-green-600 font-bold">Balance: ₱<span id="balance">0.00</span></p>
        </div>

        <!-- Garden -->
        <div class="grid grid-cols-2 gap-4" id="garden">
            <!-- Dynamically populated -->
        </div>

        <!-- Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white p-4 flex justify-around border-t">
            <button onclick="showSection('home')">Home</button>
            <button onclick="showSection('referral')">Invite</button>
            <button onclick="showSection('withdraw')">Withdraw</button>
        </nav>
    </div>

    <footer class="text-center p-4 text-xs text-gray-500" id="footer-date"></footer>

    <script type="module" src="app.js"></script>
</body>
</html>
