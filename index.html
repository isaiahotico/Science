<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { --primary: #2ecc71; --secondary: #f1c40f; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f3f5; margin: 0; padding: 10px; text-align: center; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: var(--dark); margin: 10px 0; }
        .user-bar { background: var(--dark); color: white; padding: 10px; border-radius: 10px; display: flex; justify-content: space-around; font-weight: bold; margin-bottom: 15px; }
        .balance-display { font-size: 24px; color: var(--primary); font-weight: bold; margin: 10px 0; }
        
        .btn { border: none; border-radius: 8px; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; transition: 0.3s; margin: 5px 0; font-size: 16px; }
        .btn-ads { background: var(--secondary); color: #000; }
        .btn-gift { background: #e67e22; color: #fff; }
        .btn-withdraw { background: #3498db; color: #fff; }
        .btn-claim { background: var(--primary); color: white; display: none; }
        .btn-admin { background: #95a5a6; color: white; font-size: 12px; width: auto; padding: 5px 10px; }
        button:disabled { background: #bdc3c7 !important; cursor: not-allowed; }

        .view { display: none; }
        .active { display: block; }
        .cooldown { font-size: 12px; color: #e74c3c; display: block; height: 15px; }
        
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; }
        table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .status-Pending { color: orange; } .status-Paid { color: green; } .status-Denied { color: red; }
        .pagination { margin-top: 10px; }        .ref-box { font-size: 12px; background: #eee; padding: 5px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="user-bar">
        <span id="userBar">👤 User: Loading...</span>
        <span id="balanceDisplay">PHP 0.000</span>
    </div>

    <!-- HOME PAGE -->
    <div id="view-home" class="view active">
        <h1>🍍 PAPERHOUSE INC 🍍</h1>
        <button class="btn btn-ads" onclick="changeView('view-tasks')">🍍ADS AREA🍍</button>
        <button class="btn btn-gift" onclick="changeView('view-gifts')">🍍Paper house Gift🍍</button>
        <button class="btn" style="background:#8e44ad; color:white;">🍍Paper house Sign In🍍</button>
        <button class="btn btn-withdraw" onclick="changeView('view-withdraw')">Withdraw your Money here</button>
        
        <div class="ref-box" id="refLink">Referral Link: Loading...</div>
        <br>
        <button class="btn btn-admin" onclick="openAdmin()">Owner Dashboard</button>
    </div>

    <!-- TASKS PAGE -->
    <div id="view-tasks" class="view card">
        <h2>🤑 Task Area 🤑</h2>
        <div class="task-box">
            <button class="btn btn-ads" id="btn-task1" onclick="triggerAd(1, 10276123, 'task')">🤑🍍Task #1🍍🤑</button>
            <button class="btn btn-claim" id="claim-task1" onclick="claimReward('task', 1, 0.02, 5)">Claim 0.02</button>
            <span class="cooldown" id="cd-task1"></span>
        </div>
        <div class="task-box">
            <button class="btn btn-ads" id="btn-task2" onclick="triggerAd(2, 10337795, 'task')">🤑🍍Task #2🍍🤑</button>
            <button class="btn btn-claim" id="claim-task2" onclick="claimReward('task', 2, 0.02, 5)">Claim 0.02</button>
            <span class="cooldown" id="cd-task2"></span>
        </div>
        <div class="task-box">
            <button class="btn btn-ads" id="btn-task3" onclick="triggerAd(3, 10337853, 'task')">🤑🍍Task #3🍍🤑</button>
            <button class="btn btn-claim" id="claim-task3" onclick="claimReward('task', 3, 0.02, 5)">Claim 0.02</button>
            <span class="cooldown" id="cd-task3"></span>
        </div>
        <button class="btn" onclick="changeView('view-home')">Back</button>
    </div>

    <!-- GIFTS PAGE -->    <div id="view-gifts" class="view card">
        <h2>🎁 Gift Area 🎁</h2>
        <div class="task-box">
            <button class="btn btn-gift" id="btn-gift1" onclick="triggerAd(1, 10276123, 'gift')">🍍Gift #1🍍</button>
            <button class="btn btn-claim" id="claim-gift1" onclick="claimReward('gift', 1, 0.02, 20)">Claim 0.02</button>
            <span class="cooldown" id="cd-gift1"></span>
        </div>
        <div class="task-box">
            <button class="btn btn-gift" id="btn-gift2" onclick="triggerAd(2, 10337795, 'gift')">🍍Gift #2🍍</button>
            <button class="btn btn-claim" id="claim-gift2" onclick="claimReward('gift', 2, 0.02, 20)">Claim 0.02</button>
            <span class="cooldown" id="cd-gift2"></span>
        </div>
        <div class="task-box">
            <button class="btn btn-gift" id="btn-gift3" onclick="triggerAd(3, 10337853, 'gift')">🍍Gift #3🍍</button>
            <button class="btn btn-claim" id="claim-gift3" onclick="claimReward('gift', 3, 0.02, 20)">Claim 0.02</button>
            <span class="cooldown" id="cd-gift3"></span>
        </div>
        <button class="btn" onclick="changeView('view-home')">Back</button>
    </div>

    <!-- WITHDRAW PAGE -->
    <div id="view-withdraw" class="view card">
        <h2>Withdraw Money</h2>
        <div class="card" style="border:1px solid #3498db">
            <h3>GCash</h3>
            <input type="number" id="withdraw-amount-gcash"placeholder="Amount PHP">
            <input type="text" id="withdraw-number-gcash" placeholder="GCash Number">
            <button class="btn btn-withdraw" onclick="requestWithdrawal('GCash')">Submit GCash</button>
        </div>
        <div class="card" style="border:1px solid #1abc9c">
            <h3>FaucetPay</h3>
            <p style="font-size:10px">Auto-convert to USDT (Rate: 1 PHP = 0.017 USDT)</p>
            <input type="number" id="withdraw-amount-fp" placeholder="Amount PHP">
            <input type="email" id="withdraw-email-fp" placeholder="FaucetPay Email">
            <button class="btn" style="background:#1abc9c; color:white" onclick="requestWithdrawal('FaucetPay')">Submit FaucetPay</button>
        </div>
        
        <h3>Withdrawal History</h3>
        <table id="history-table">
            <thead><tr><th>Date</th><th>Method</th><th>Amount</th><th>Status</th></tr></thead>
            <tbody id="history-body"></tbody>
        </table>
        <div class="pagination" id="history-pagination"></div>
        <button class="btn" onclick="changeView('view-home')">Back</button>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="view-admin" class="view card">
        <h2>Owner Dashboard</h2>
        <div class="user-bar">Total Paid: <span id="admin-total-paid">0</span> PHP</div>
        <table id="admin-table">
            <thead><tr><th>User</th><th>Method/Details</th><th>Amount</th><th>Action</th></tr></thead>
            <tbody id="admin-body"></tbody>
        </table>
        <div class="pagination" id="admin-pagination"></div>
        <button class="btn" onclick="changeView('view-home')">Exit Dashboard</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
