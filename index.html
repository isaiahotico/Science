<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>

    <style>
        :root { --p: #f1c40f; --s: #27ae60; --a: #e67e22; --bg: #fffdf2; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--dark); }
        
        .header { background: var(--p); padding: 10px; text-align: center; border-bottom: 3px solid #d4ac0d; position: sticky; top: 0; z-index: 1000; height: 75px; }
        .balance-box { font-size: 1.5rem; font-weight: 900; color: #1e8449; }

        .container { padding: 10px; max-width: 500px; margin: auto; }
        .page { display: none; text-align: center; }
        .active { display: block; }

        .btn { background: var(--a); color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-size: 1rem; font-weight: bold; margin: 6px 0; cursor: pointer; box-shadow: 0 4px #a04000; }
        .btn:disabled { background: #bdc3c7; box-shadow: none; opacity: 0.8; }

        /* Chat Window */
        #chatMessages { height: 45vh; overflow-y: auto; background: white; border: 2px solid var(--p); border-radius: 12px; padding: 10px; margin-bottom: 10px; text-align: left; }
        .msg { margin-bottom: 10px; border-bottom: 1px solid #f9f9f9; padding-bottom: 5px; }
        .msg-u { font-weight: bold; color: var(--a); font-size: 0.9rem; }
        .msg-t { font-size: 0.85rem; color: #333; display: block; }
        .msg-d { font-size: 0.65rem; color: #aaa; }

        .card { background: white; padding: 15px; border-radius: 15px; border: 2px solid var(--p); margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 10px; overflow: hidden; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; font-size: 0.85rem; }
        th { background: #fdf2d0; }

        input { width: 85%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; }        .footer { font-size: 0.7rem; color: #7f8c8d; text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div id="userBar">👤 User: Loading...</div>
        <div class="balance-box">₱ <span id="balance">0.000</span></div>
    </div>

    <div class="container">
        <!-- Home -->
        <div id="homePage" class="page active">
            <h1>🍍 PAPERHOUSE INC</h1>
            <button class="btn" onclick="nav('adsArea')">🍍 ADS AREA 🍍</button>
            <button class="btn" onclick="nav('signInArea')">🍍 Sign In 🍍</button>
            <button class="btn" onclick="nav('giftArea')">🍍 Gift Area 🍍</button>
            <button class="btn" style="background:#8e44ad" onclick="nav('refPage')">👥 Referral System 👥</button>
            <button class="btn" style="background:#34495e" onclick="nav('leadPage')">🏆 Leaderboard 🏆</button>
            <button class="btn" style="background:#1abc9c" onclick="nav('chatPage')">💬 Global Chat 💬</button>
            <button class="btn" style="background:#2980b9" onclick="nav('withdrawPage')">💸 Withdraw Money 💸</button>
            <button class="btn" style="background:#3498db" onclick="nav('helpPage')">❓ Help</button>
            <p onclick="adminLogin()" style="color:#ddd; font-size:0.6rem; cursor:pointer;">Owner</p>
        </div>

        <!-- Chat -->
        <div id="chatPage" class="page">
            <button class="btn" style="width:30%" onclick="nav('homePage')">Back</button>
            <div id="chatMessages"></div>
            <div class="card">
                <input type="text" id="chatInput" placeholder="Write message...">
                <button class="btn" style="background:var(--s)" onclick="sendMsg()">Send Message</button>
            </div>
        </div>

        <!-- Ads -->
        <div id="adsArea" class="page">
            <button class="btn" onclick="nav('homePage')">Back</button>
            <div id="adsList"></div>
        </div>

        <!-- Sign In -->
        <div id="signInArea" class="page">
            <button class="btn" onclick="nav('homePage')">Back</button>
            <div id="signInList"></div>
        </div>

        <!-- Gift -->
        <div id="giftArea" class="page">            <button class="btn" onclick="nav('homePage')">Back</button>
            <div id="giftList"></div>
        </div>

        <!-- Referral -->
        <div id="refPage" class="page">
            <button class="btn" onclick="nav('homePage')">Back</button>
            <div class="card">
                <p>Your Code: <strong id="myCode">--</strong></p>
                <div id="refInputSection">
                    <input type="text" id="refInput" placeholder="Enter Code">
                    <button class="btn" onclick="setInviter()">Save</button>
                </div>
            </div>
            <div class="card">
                <h3>Referral Bonus: ₱<span id="refBonus">0.00</span></h3>
                <button class="btn" style="background:var(--s)" onclick="claimBonus()">Claim to Balance</button>
            </div>
            <div class="card">
                <h3>Referral Stats</h3>
                <table>
                    <thead><tr><th>Invites</th><th>Total Gains</th></tr></thead>
                    <tbody><tr><td id="refCount">0</td><td id="refTotal">₱ 0.00</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Leaderboard -->
        <div id="leadPage" class="page">
            <button class="btn" onclick="nav('homePage')">Back</button>
            <h3>🏆 Top 20</h3>
            <table id="leaderboard">
                <thead><tr><th>#</th><th>User</th><th>Balance</th></tr></thead>
                <tbody id="leadBody"></tbody>
            </table>
        </div>

        <!-- Withdraw -->
        <div id="withdrawPage" class="page">
            <button class="btn" onclick="nav('homePage')">Back</button>
            <div class="card">
                <input type="number" id="wAmt" placeholder="PHP Amount">
                <input type="text" id="wTarget" placeholder="GCash/FaucetPay">
                <button class="btn" style="background:var(--s)" onclick="requestW()">Submit Request</button>
            </div>
            <table>
                <thead><tr><th>Date</th><th>Method</th><th>Status</th></tr></thead>
                <tbody id="wHistory"></tbody>
            </table>
        </div>

        <!-- Help -->
        <div id="helpPage" class="page">
            <button class="btn" onclick="nav('homePage')">Back</button>
            <div class="card">
                <p>Support Email:</p>
                <a href="mailto:otico.isai2@gmail.com">otico.isai2@gmail.com</a>
            </div>
        </div>

        <!-- Admin -->
        <div id="adminPage" class="page">
            <button class="btn" onclick="nav('homePage')">Logout</button>
            <h3>Admin Panel</h3>
            <div id="adminReqs"></div>
        </div>

        <div class="footer">
            © PAPERHOUSE INC<br>
            <span id="realTime"></span>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
