<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global YouTube Sync</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
.container{max-width:720px;margin:auto;padding:12px}

#playerWrap{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:12px;
}

#userBar{font-weight:bold;margin-bottom:6px}

input,button{
  padding:10px;
  border-radius:10px;
  border:none;
  width:100%;
  margin-top:6px;
}

button{
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px
}

td,th{
  padding:8px;
  border-bottom:1px solid #334155
}
</style>
</head>

<body>
<div class="container">

<div id="userBar">👤 Loading…</div>

<!-- ✅ PLAYER ALWAYS ON TOP -->
<div id="playerWrap">
  <div id="player"></div>
</div>

<input id="ytUrl" placeholder="Paste YouTube link" />
<button onclick="addVideo()">➕ Add & Play (Global)</button>
<button onclick="nextRandom()">🎲 Next (Random)</button>

<table>
<thead>
<tr><th>#</th><th>Video</th><th>Play</th></tr>
</thead>
<tbody id="playlist"></tbody>
</table>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
