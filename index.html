<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAPERHOUSE OMNI-ADMIN</title>
    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    <script src='//libtl.com/sdk.js' data-zone='10555746' data-sdk='show_10555746'></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        body { background: #020617; color: #f8fafc; font-family: 'Outfit', sans-serif; overflow: hidden; height: 100vh; }
        .page { display: none; height: calc(100vh - 165px); overflow-y: auto; padding: 15px; padding-bottom: 60px; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .nav-active { color: #facc15; border-top: 3px solid #facc15; background: linear-gradient(to bottom, rgba(250, 204, 21, 0.05), transparent); }
        .popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .web-card { display:none; position:fixed; bottom:0; left:0; width:100%; height:75%; background:white; z-index:10000; border-radius:30px 30px 0 0; overflow:hidden; box-shadow: 0 -20px 50px rgba(0,0,0,0.5); }
        .btn-disabled { filter: grayscale(1); opacity: 0.4; pointer-events: none; }
        input, select, textarea { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; width: 100%; border-radius: 15px; padding: 14px; outline: none; }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body class="select-none">

    <!-- Header -->
    <header class="p-5 flex justify-between items-center glass sticky top-0 z-[100]">
        <div class="flex items-center gap-3">            <div class="h-10 w-10 bg-yellow-400 rounded-xl flex items-center justify-center font-black text-black">P</div>
            <div>
                <h1 class="text-[9px] font-black tracking-widest text-slate-500 uppercase">Apex Omni</h1>
                <p id="tg-username" class="text-sm font-bold text-yellow-400 italic">@...</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-xl font-black">₱<span id="balance">0.0000</span></p>
        </div>
    </header>

    <main>
        <!-- EARN PAGE -->
        <div id="earn" class="page active space-y-4">
            <div class="glass p-8 rounded-[2.5rem] text-center relative overflow-hidden border border-yellow-400/10">
                <div id="cooldown-box" class="absolute top-0 left-0 h-1 bg-yellow-400 w-0 transition-all duration-1000"></div>
                <h2 class="text-xl font-black italic">ULTRA BUNDLE</h2>
                <button id="adBtn" onclick="fireAdChain('bundle')" class="w-full bg-yellow-400 text-black py-5 rounded-2xl font-black text-xl mt-6 shadow-xl">CLAIM ₱0.024</button>
                <p id="timer-text" class="text-[10px] mt-4 font-black text-yellow-500 h-4 uppercase"></p>
            </div>

            <div class="glass rounded-[2rem] h-[320px] flex flex-col border border-white/5 overflow-hidden">
                <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-2 text-[12px]"></div>
                <div class="p-3 bg-slate-900/50 flex gap-2">
                    <input type="text" id="chatInput" placeholder="Message community...">
                    <button onclick="sendMsg()" class="bg-white text-black px-5 rounded-xl font-black text-xs">SEND</button>
                </div>
            </div>
        </div>

        <!-- TASKS PAGE -->
        <div id="tasks" class="page space-y-4">
            <div class="flex gap-2">
                <button onclick="switchTaskTab('fb')" id="tab-fb" class="flex-1 p-4 rounded-2xl bg-blue-600 font-black text-[10px] uppercase">FB Tasks</button>
                <button onclick="switchTaskTab('web')" id="tab-web" class="flex-1 p-4 rounded-2xl glass font-black text-[10px] uppercase">Web Tasks</button>                <button onclick="showTaskForm()" class="p-4 rounded-2xl bg-green-600 font-black text-xs"><i class="fas fa-plus"></i></button>
            </div>
            <div id="task-list" class="space-y-3"></div>
        </div>

        <!-- REFERRAL PAGE -->
        <div id="refer" class="page">
            <div class="glass p-8 rounded-[2.5rem] text-center border border-blue-500/20">
                <h2 class="text-xl font-black text-yellow-400 italic mb-2">PARTNERS</h2>
                <div class="bg-black/40 p-6 rounded-3xl mb-6 font-mono text-3xl font-black tracking-widest italic" id="myCode">------</div>
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="glass p-4 rounded-2xl">Slots: <span id="totalInvites">0</span>/12</div>
                    <div class="glass p-4 rounded-2xl text-green-400" id="totalRefEarned">₱0.00</div>
                </div>
                <input type="text" id="inputCode" placeholder="Invite Code" class="text-center mb-3">
                <button onclick="applyRef()" id="applyBtn" class="w-full bg-white text-black font-black p-4 rounded-2xl shadow-xl">LINK PARTNER</button>
            </div>
        </div>

        <!-- WALLET PAGE -->
        <div id="wallet" class="page space-y-4">
            <div class="glass p-6 rounded-[2.5rem] space-y-4">
                <select id="wd-method" onchange="updateWalletLabels()"><option value="gcash">GCASH</option>
                    <option value="paypal">PAYPAL</option>
                    <option value="faucetpay">FAUCETPAY</option>
                </select>
                <input type="text" id="wd-acc" placeholder="Account detail">
                <input type="number" id="wd-amt" placeholder="Amount (₱)">
                <button onclick="requestWithdraw()" class="w-full bg-green-500 text-white p-5 rounded-2xl font-black">WITHDRAW</button>
            </div>
            <div id="user-wd-history" class="space-y-2"></div>
        </div>

        <!-- ADMIN PAGE -->
        <div id="admin" class="page">
            <div id="admin-login" class="glass p-8 rounded-[2.5rem] text-center">
                <input type="password" id="admin-pass" placeholder="Password" class="text-center mb-4">
                <button onclick="checkAdmin()" class="w-full bg-red-600 p-4 rounded-xl font-black">ACCESS ROOT</button>
            </div>
            <div id="admin-content" class="hidden space-y-4">
                <div class="glass p-6 rounded-3xl border border-blue-500/20">
                    <p class="text-xs font-black mb-4 uppercase">Create Global Task (Free / 100K Cap)</p>
                    <select id="adm-type" class="mb-3">
                        <option value="fb">FB FOLLOW</option>
                        <option value="web">WEB VISIT</option>
                    </select>
                    <input type="text" id="adm-link" placeholder="Link (https://...)" class="mb-3">
                    <textarea id="adm-desc" placeholder="Definition (e.g. Follow my page)" class="mb-3"></textarea>
                    <button onclick="createAdminTask()" class="w-full bg-blue-600 p-4 rounded-xl font-black">POST GLOBAL TASK</button>
                </div>
                <div id="admin-list" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <!-- UI MODALS -->
    <div id="task-modal" class="popup-overlay">
        <div class="glass p-6 rounded-[3rem] w-full max-w-sm">
            <h2 class="text-lg font-black mb-1">PROMOTE LINK</h2>
            <p class="text-[10px] text-slate-500 font-bold mb-6 italic">COST: ₱2.00 (100 VISITS)</p>
            <div class="space-y-4">
                <select id="task-type-input">
                    <option value="fb">FB PAGE FOLLOW</option>
                    <option value="web">WEBSITE VISIT</option>
                </select>
                <input type="text" id="task-link" placeholder="https://...">
                <textarea id="task-desc" placeholder="Define what users must do"></textarea>
                <button onclick="buyTask()" class="w-full bg-yellow-400 text-black p-5 rounded-2xl font-black shadow-xl">BUY TASK (₱2.00)</button>
                <button onclick="closePop('task-modal')" class="w-full text-slate-500 font-bold text-xs">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="web-view" class="web-card">
        <div class="bg-slate-100 p-4 flex justify-between items-center border-b">
            <span class="text-black font-black text-xs">REWARDING IN: <span id="web-timer">12</span>s</span>
            <button onclick="closeWebCard()" class="text-red-600 font-black text-xs uppercase">Exit</button>
        </div>
        <iframe id="task-iframe" src="" class="w-full h-full border-none"></iframe>
    </div>

    <div id="quote-popup" class="popup-overlay">
        <div class="glass p-8 rounded-[3.5rem] text-center border border-yellow-400/30 max-w-xs shadow-2xl">
            <p class="text-green-400 font-black text-2xl mb-6">CREDITED!</p>
            <p id="quote-text" class="text-slate-200 italic text-sm mb-8 px-2"></p>
            <button onclick="closePop('quote-popup')" class="w-full bg-white text-black py-5 rounded-2xl font-black">CONTINUE</button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 p-4 flex justify-around items-center z-[100] rounded-t-[2.5rem]">
        <button onclick="showPage('earn')" id="nav-earn" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black nav-active"><i class="fas fa-bolt text-lg mb-1"></i>Earn</button>
        <button onclick="showPage('tasks')" id="nav-tasks" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black text-slate-500"><i class="fas fa-tasks text-lg mb-1"></i>Tasks</button>
        <button onclick="showPage('refer')" id="nav-refer" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black text-slate-500"><i class="fas fa-link text-lg mb-1"></i>Link</button>
        <button onclick="showPage('wallet')" id="nav-wallet" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black text-slate-500"><i class="fas fa-wallet text-lg mb-1"></i>Cash</button>
        <button onclick="showPage('admin')" id="nav-admin" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black text-slate-900"><i class="fas fa-lock text-lg mb-1"></i>Root</button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
