<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampaguita Mining Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Ad SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.4); }
        .sampaguita-card { transition: all 0.3s ease; border-left: 4px solid #10b981; }
        .sampaguita-card:hover { transform: translateY(-2px); }
        .status-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; }
    </style>
</head>
<body class="pb-24">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-sm">
        <div>
            <h1 class="font-extrabold text-emerald-600 text-lg">SAMPAGUITA <span class="text-slate-400 font-light">MINER</span></h1>
            <p class="text-[10px] text-slate-400 font-mono" id="user-id-display">UID: Generating...</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] uppercase font-bold text-slate-400">Total Users</p>
            <p class="font-bold text-slate-700" id="global-count">0</p>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Wallet Card -->
        <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-[2rem] p-6 text-white shadow-xl shadow-emerald-100">
            <div class="flex justify-between items-start mb-4">
                <span class="text-sm opacity-80">Current Balance</span>
                <i class="fas fa-wallet opacity-50"></i>
            </div>
            <div class="flex items-baseline gap-2">
                <span class="text-4xl font-black">₱</span>                <span class="text-5xl font-black tracking-tighter" id="main-balance">0.0000</span>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="switchTab('withdraw')" class="flex-1 bg-white/20 hover:bg-white/30 py-3 rounded-2xl text-sm font-semibold transition">Withdraw</button>
                <button onclick="buySampaguita()" class="flex-1 bg-white text-emerald-600 py-3 rounded-2xl text-sm font-bold shadow-lg active:scale-95 transition">
                    <i class="fas fa-plus-circle mr-1"></i> Buy Plant
                </button>
            </div>
        </div>

        <!-- Hourly Ad Tracker -->
        <div class="flex justify-between items-center px-2">
            <span class="text-xs font-bold text-slate-500 uppercase">Hourly Limits (Ads)</span>
            <span class="text-xs font-mono bg-slate-200 px-2 py-1 rounded" id="ad-limit-counter">0 / 10</span>
        </div>

        <!-- Plant Section Header -->
        <div id="dynamic-title" class="px-2">
            <h2 class="font-black text-slate-800 text-xl">My Garden</h2>
            <p class="text-xs text-slate-400" id="plant-stats">0 Active Contracts</p>
        </div>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="space-y-4">
            <!-- Individual Plant Cards Injected Here -->
            <div class="text-center py-20 animate-pulse">
                <i class="fas fa-seedling text-4xl text-slate-200 mb-2"></i>
                <p class="text-slate-400 text-sm">Loading your garden...</p>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-200 flex justify-around p-4 z-50">
        <button onclick="switchTab('home')" class="nav-btn text-emerald-600"><i class="fas fa-leaf text-xl"></i></button>
        <button onclick="switchTab('refer')" class="nav-btn text-slate-400"><i class="fas fa-users text-xl"></i></button>
        <button onclick="switchTab('withdraw')" class="nav-btn text-slate-400"><i class="fas fa-history text-xl"></i></button>
        <button onclick="adminLogin()" class="nav-btn text-slate-400"><i class="fas fa-user-shield text-xl"></i></button>
    </nav>

    <footer class="text-center pb-24 mt-4">
        <p class="text-[10px] text-slate-400" id="realtime-clock"></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
