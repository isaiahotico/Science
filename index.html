<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎖PAPERHOUSE INC🎖</title>
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='3136495' data-sdk='show_3136495'></script>
    <script src='//libtl.com/sdk.js' data-zone='3152686' data-sdk='show_3152686'></script>
    <script src='//libtl.com/sdk.js' data-zone='3152703' data-sdk='show_3152703'></script>
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --dark: #0f0f0f;
            --card-bg: #1a1a1a;
        }

        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .header {
            background: var(--gold);
            padding: 20px;
            color: black;
            font-weight: 800;
            font-size: 1.5rem;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            border-bottom: 2px solid gold;
        }

        .balance-card {
            background: var(--card-bg);
            margin: 20px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #bf953f;
        }

        .balance-card h2 { color: #fcf6ba; font-size: 2rem; margin: 10px 0; }

        .ads-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        button {
            background: var(--gold);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:disabled { background: #555; cursor: not-allowed; }

        .full-width { grid-column: span 2; }

        .nav {
            display: flex;
            justify-content: space-around;

            background: #111;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            border-top: 1px solid gold;
        }

        .section { display: none; padding-bottom: 80px; }
        .active { display: block; }

        table { width: 90%; margin: 20px auto; border-collapse: collapse; background: #222; }
        th, td { border: 1px solid #bf953f; padding: 10px; font-size: 0.8rem; }
        th { background: var(--gold); color: black; }

        /* Admin UI */
        .admin-panel { background: #111; padding: 20px; border-top: 5px solid gold; }
        .input-group { margin: 10px 0; }
        input { padding: 10px; border-radius: 5px; border: none; width: 80%; }
    </style>
</head>
<body>

    <div class="header">🎖PAPERHOUSE INC🎖</div>

    <!-- MAIN APP SECTION -->
    <div id="home" class="section active">
        <div class="balance-card">
            <p>Your GCash Balance</p>
            <h2 id="user-balance">₱0.0000</h2>
        </div>

        <div class="ads-grid">
            <button onclick="handleAd('LOGIN1', 0.0075, 3600, '3136495')">🤑LOGIN1🤑</button>
            <button onclick="handleAd('LOGIN2', 0.0075, 3600, '3152686')">🤑LOGIN2🤑</button>
            <button onclick="handleAd('LOGIN3', 0.0075, 3600, '3152703')">🤑LOGIN3🤑</button>
            
            <button onclick="handlePopupAd('GIFT1', 0.075, 900, '10276123')">🎖GIFT1🎉</button>
            <button onclick="handlePopupAd('GIFT2', 0.075, 900, '10337795')">🎖GIFT2🎉</button>
            <button onclick="handlePopupAd('GIFT3', 0.075, 900, '10337853')">🎖GIFT3🎉</button>

            <button class="full-width" onclick="handleVipAds()">🎖VIP🎉ADS🎖</button>
            <button class="full-width" onclick="handlePremiumAds()">🎖PREMIUM🎉ADS🎖</button>
        </div>
    </div>

    <!-- WITHDRAW SECTION -->
    <div id="withdraw" class="section">
        <h3>Withdraw to GCash</h3>
        <p>Min Withdraw: ₱1.00</p>
        <div class="input-group">
            <input type="text" id="gcash-name" placeholder="GCash Name"><br><br>
            <input type="number" id="gcash-number" placeholder="GCash Number"><br><br>
            <input type="number" id="withdraw-amount" placeholder="Amount (Min 1)">
        </div>
        <br>
        <button onclick="requestWithdrawal()">SUBMIT REQUEST</button>

        <h4>Withdrawal History</h4>
        <table>
            <thead><tr><th>Date</th><th>Amount</th><th>Status</th></tr></thead>
            <tbody id="user-history-table"></tbody>
        </table>
    </div>

    <!-- OWNER DASHBOARD -->
    <div id="admin" class="section">
        <h3>Admin Dashboard</h3>
        <div id="admin-login">
            <input type="password" id="admin-pass" placeholder="Enter Password">
            <button onclick="checkAdmin()">LOGIN</button>
        </div>
        <div id="admin-content" style="display:none;">
            <h4>Pending Requests</h4>
            <div id="pending-list"></div>
            <h4>Approved History</h4>
            <table>
                <thead><tr><th>User UID</th><th>Amount</th><th>Status</th></tr></thead>
                <tbody id="admin-history-table"></tbody>
            </table>
        </div>
    </div>

    <div class="nav">
        <div onclick="showSection('home')">🏠 ADS</div>
        <div onclick="showSection('withdraw')">💸 PAYOUT</div>
        <div onclick="showSection('admin')">👑 OWNER</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
