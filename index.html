<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Telegram Aide YouTube Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #000;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
      font-size: 16px;
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #1b74e4;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .video-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      margin-top: 20px;
      background: #fff;
    }
    .video-card img {
      width: 100%;
      border-radius: 8px;
    }
    .video-info {
      margin-top: 10px;
    }
    .video-info p {
      margin: 4px 0;
    }
    .buttons {
      margin-top: 12px;
    }
    .buttons button {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Telegram Aide YouTube Player</h2>
    <input type="text" id="youtubeUrl" placeholder="Paste YouTube URL here">
    <button onclick="loadVideo()">Load Video</button>
    <div id="videoContainer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
