<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { --gold: #ffd700; --green: #2ecc71; --dark: #0a0a0a; --card: #161616; --blue: #0088cc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; padding-bottom: 100px; text-align: center; }
        .header { background: var(--card); padding: 15px; border-radius: 15px; border-bottom: 3px solid var(--gold); margin-bottom: 10px; }
        #userBar { color: var(--blue); font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .balance-main { font-size: 2.5rem; color: var(--green); font-weight: bold; }
        
        button { width: 100%; padding: 14px; margin: 5px 0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-main { background: var(--gold); color: black; }
        .btn-task { background: var(--green); color: white; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-withdraw { background: #e74c3c; color: white; }
        
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #333; }
        .hidden { display: none; }
        .cooldown { font-size: 11px; color: #ff7675; }
        
        #chat-box { height: 200px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; text-align: left; font-size: 12px; border: 1px solid #444; margin-bottom: 10px; }
        .msg { margin-bottom: 5px; border-bottom: 1px solid #222; padding-bottom: 3px; }
        
        table { width: 100%; font-size: 11px; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; text-align: center; }        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 10px 0; font-size: 10px; border-top: 1px solid #333; color: #888; z-index: 100; }
    </style>
</head>
<body>

<div class="header">
    <div id="userBar">👤 User: Loading...</div>
    <div class="balance-main">₱<span id="topBalance">0.000</span></div>
    <div style="font-size:10px; color:#666">GLOBAL PAYOUTS: ₱<span id="globalTotal">0.00</span></div>
</div>

<div id="page-main">
    <button class="btn-main" onclick="navTo('page-ads')">🍍ADS AREA🍍</button>
    <button class="btn-main" onclick="navTo('page-gift')">🍍GIFT AREA🍍</button>
    <button class="btn-blue" onclick="navTo('page-chat')">💬 CHAT WITH FRIENDS 💬</button>
    <button class="btn-main" style="background:#9b59b6; color:white;" onclick="navTo('page-ref')">👥 REFERRALS 👥</button>
    <button class="btn-main" style="background:#555; color:white;" onclick="navTo('page-leader')">🏆 LEADERBOARD 🏆</button>
    <button class="btn-main" style="background:#444; color:white;" onclick="navTo('page-help')">❓ HELP SECTION ❓</button>
    <button class="btn-withdraw" onclick="navTo('page-withdraw')">💰 WITHDRAW 💰</button>
    <button style="background:transparent; color:#222; font-size:10px" onclick="openAdmin()">ADMIN</button>
</div>

<!-- HELP PAGE -->
<div id="page-help" class="hidden">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div class="card">
        <h3>Help & Updates</h3>
        <a href="https://t.me/paperhouseinc" class="btn-blue">Telegram Group</a>
        <a href="https://facebook.com/groups/1193693469083843/" class="btn-blue">Facebook Group</a>
    </div>
</div>

<!-- CHAT PAGE -->
<div id="page-chat" class="hidden">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div class="card">
        <div id="chat-box"></div>
        <input type="text" id="chatInput" placeholder="Message...">
        <button class="btn-blue" onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- WITHDRAW PAGE -->
<div id="page-withdraw" class="hidden">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div class="card">
        <div style="font-size:24px; color:var(--green)">₱<span id="earnBox">0.000</span></div>
        <input type="text" id="payoutInfo" placeholder="Number or Email">
        <button class="btn-task" onclick="handleWithdraw('GCash')">Withdraw GCash (PHP)</button>
        <button class="btn-blue" onclick="handleWithdraw('FaucetPay')">Withdraw FaucetPay (USDT)</button>
    </div>
    <table id="userHistTable"><thead><tr><th>Amt</th><th>Status</th></tr></thead><tbody id="userHistBody"></tbody></table>
</div>

<!-- LEADERBOARD -->
<div id="page-leader" class="hidden">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div class="card"><h3>Top Earners</h3><table id="leaderTable"><tbody></tbody></table></div>
</div>

<!-- REFERRAL -->
<div id="page-ref" class="hidden">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div class="card">
        <h3>Invite Friends</h3>
        <input type="text" id="refLink" readonly>
    </div>
</div>

<!-- TASK PAGES -->
<div id="page-ads" class="hidden"><button onclick="navTo('page-main')">⬅ Back</button><div id="cont-ads"></div></div>
<div id="page-gift" class="hidden"><button onclick="navTo('page-main')">⬅ Back</button><div id="cont-gift"></div></div>

<!-- ADMIN -->
<div id="page-admin" class="hidden">
    <button onclick="navTo('page-main')">Exit</button>
    <div id="adminBody"></div>
</div>

<div class="footer">
    <div id="footerClock"></div>
    <b>PAPERHOUSE INC</b> | otico.isai2@gmail.com
</div>

<script type="module" src="app.js"></script>
</body>
</html>
