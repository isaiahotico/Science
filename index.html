<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Monetag Tags - Add your script tags here -->
    <script src="https://alwingulla.com/88/p.js" async></script>

    <style>
        :root { --gold: #ffd700; --green: #2ecc71; --bg: #1a1a1a; }
        body { font-family: 'Arial', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; text-align: center; }
        .card { background: #2a2a2a; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #444; }
        .user-bar { display: flex; justify-content: space-between; font-size: 14px; color: var(--gold); margin-bottom: 20px; }
        .balance { font-size: 32px; color: var(--green); font-weight: bold; margin: 10px 0; }
        .title { font-size: 28px; font-weight: 900; color: var(--gold); letter-spacing: 2px; margin-bottom: 5px; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin: 10px 0; transition: 0.3s; }
        .btn-ads { background: linear-gradient(45deg, #f39c12, #e67e22); color: white; }
        .btn-task { background: #2ecc71; color: white; }
        .btn-claim { background: #3498db; color: white; }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: center; }
        .status-paid { color: #2ecc71; }
        .status-pending { color: #f1c40f; }
    </style>
</head>
<body>

    <div class="user-bar">
        <span id="userBar">👤 User: Guest</span>
        <span>Balance: ₱<span id="topBalance">0.00</span></span>
    </div>

    <div class="title">PAPERHOUSE INC</div>
    <div style="font-size: 10px; color: grey; margin-bottom: 20px;">TOTAL WITHDRAWN: ₱<span id="globalWithdrawn">0.00</span></div>

    <!-- MAIN PAGE -->
    <div id="page-main">
        <div class="card">
            <div style="font-size: 14px;">YOUR WALLET</div>
            <div class="balance">₱ <span id="mainBalance">0.00</span></div>
        </div>        <button class="btn-ads" onclick="showPage('page-ads')">🍍ADS AREA🍍</button>
        <button style="background: #e74c3c; color: white;" onclick="showPage('page-withdraw')">Withdraw your Money here</button>
        <button style="background: #555; color: white; font-size: 10px;" onclick="checkAdmin()">Owner Dashboard</button>
        
        <div class="card" style="font-size: 12px;">
            Referral Link (10% Bonus):<br>
            <input type="text" id="refLink" readonly onclick="this.select()">
        </div>
    </div>

    <!-- ADS PAGE -->
    <div id="page-ads" class="hidden">
        <button onclick="showPage('page-main')">⬅ Back</button>
        <div class="card">
            <button class="btn-task" id="t1-btn" onclick="runTask(1)">🤑🍍Task #1🍍🤑</button>
            <div id="t1-claim" class="hidden"><button class="btn-claim" onclick="claim(1)">Claim ₱0.02</button></div>
            <div id="t1-timer" style="font-size: 12px; color: #888;"></div>
        </div>
        <div class="card">
            <button class="btn-task" id="t2-btn" onclick="runTask(2)">🤑🍍Task #2🍍🤑</button>
            <div id="t2-claim" class="hidden"><button class="btn-claim" onclick="claim(2)">Claim ₱0.02</button></div>
            <div id="t2-timer" style="font-size: 12px; color: #888;"></div>
        </div>
        <div class="card">
            <button class="btn-task" id="t3-btn" onclick="runTask(3)">🤑🍍Task #3🍍🤑</button>
            <div id="t3-claim" class="hidden"><button class="btn-claim" onclick="claim(3)">Claim ₱0.02</button></div>
            <div id="t3-timer" style="font-size: 12px; color: #888;"></div>
        </div>
    </div>

    <!-- WITHDRAW PAGE -->
    <div id="page-withdraw" class="hidden">
        <button onclick="showPage('page-main')">⬅ Back</button>
        <div class="card">
            <h3>GCash</h3>
            <input type="number" id="gcashNum" placeholder="GCash Number">
            <button class="btn-task" onclick="handleWithdraw('GCash')">Withdraw via GCash</button>
        </div>
        <div class="card">
            <h3>FaucetPay</h3>
            <input type="email" id="fpayEmail" placeholder="FaucetPay Email">
            <button class="btn-task" onclick="handleWithdraw('FaucetPay')">Withdraw via FaucetPay</button>
        </div>
        <div class="card">
            <h4>History</h4>
            <table id="histTable"><thead><tr><th>Amt</th><th>Method</th><th>Status</th></tr></thead><tbody id="histBody"></tbody></table>
            <div id="histPagination"></div>
        </div>
    </div>

    <!-- ADMIN PAGE -->
    <div id="page-admin" class="hidden">
        <button onclick="showPage('page-main')">Exit Admin</button>
        <div class="card">
            <h3>Owner Dashboard</h3>
            <table id="adminTable"><thead><tr><th>User</th><th>Amt</th><th>Info</th><th>Action</th></tr></thead><tbody id="adminBody"></tbody></table>
            <div id="adminPagination"></div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>
</html>
