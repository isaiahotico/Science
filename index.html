<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampaguita Garden - Pro Miner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Ad SDKs -->
    <script src="https://libtl.com/sdk.js" data-zone="10555663" data-sdk="show_10555663"></script>
    <script src="https://libtl.com/sdk.js" data-zone="10555746" data-sdk="show_10555746"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .active-tab { color: #059669 !important; border-top: 3px solid #059669; }
        .hidden-section { display: none !important; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .mining-dot { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen pb-24">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 border-b border-slate-200 px-4 py-4 flex justify-between items-center shadow-sm">
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Balance</p>
            <div class="flex items-center gap-1">
                <span class="text-2xl font-black text-emerald-600">₱</span>
                <span id="balance-display" class="text-2xl font-mono font-black">0.00000000</span>
            </div>
        </div>
        <div class="text-right">
            <span id="uid-display" class="text-[9px] font-mono bg-slate-800 text-white px-2 py-1 rounded">ID: ...</span>
            <p class="text-[10px] font-bold text-slate-500 mt-1">Ads Used: <span id="ad-usage">0</span>/10 hr</p>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase">My Plants</p>
                <p class="text-xl font-black" id="plant-count">0/500</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Global Miners</p>

                <p class="text-xl font-black text-emerald-600" id="global-users">...</p>
            </div>
        </div>

        <!-- Section: Home -->
        <section id="sec-home">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-black italic text-slate-700">GARDEN PANEL</h2>
                <button onclick="buyPlant()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg shadow-emerald-200 active:scale-95 transition">
                    + Buy Flower (Ad Zone 746)
                </button>
            </div>
            <div id="garden-list" class="space-y-3">
                <!-- Cards injected here -->
            </div>
        </section>

        <!-- Section: Referral -->
        <section id="sec-ref" class="hidden-section space-y-4">
            <div class="bg-slate-900 p-6 rounded-3xl text-white">
                <p class="text-xs font-bold text-emerald-400">REFERRAL PROGRAM</p>
                <h3 class="text-xl font-black mb-2">Earn 5% Commission</h3>
                <p class="text-[10px] opacity-70 mb-4 text-pretty">Your balance grows every time your invites claim their mining rewards.</p>
                <div class="bg-white/10 p-4 rounded-2xl flex justify-between items-center border border-white/10">
                    <span id="ref-code-display" class="text-xl font-mono font-bold tracking-widest">------</span>
                    <button onclick="copyRef()" class="bg-emerald-500 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase">Copy</button>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 flex gap-2">
                <input id="ref-input" type="text" placeholder="Enter Inviter Code" class="bg-slate-50 flex-1 p-3 rounded-xl text-xs font-bold border-none outline-none focus:ring-2 ring-emerald-500">
                <button onclick="bindRef()" class="bg-slate-800 text-white px-6 rounded-xl text-xs font-bold">BIND</button>
            </div>
        </section>

        <!-- Section: Withdraw -->
        <section id="sec-withdraw" class="hidden-section space-y-4">
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="font-black text-slate-800">Withdraw Funds</h3>
                <select id="wd-method" class="w-full p-3 rounded-xl bg-slate-50 border-none text-xs font-bold outline-none">
                    <option value="GCash">GCash</option>
                    <option value="FaucetPay">FaucetPay</option>
                    <option value="PayPal">PayPal</option>
                </select>
                <input id="wd-dest" type="text" placeholder="Phone Number / Email" class="w-full p-3 rounded-xl bg-slate-50 border-none text-xs font-bold outline-none">
                <input id="wd-amt" type="number" placeholder="Amount (Min ₱1.00)" class="w-full p-3 rounded-xl bg-slate-50 border-none text-xs font-bold outline-none">
                <button onclick="requestWithdraw()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition uppercase tracking-widest">Confirm Withdrawal</button>
            </div>
            <div id="wd-history" class="space-y-2"></div>
        </section>

        <!-- Section: Admin -->
        <section id="sec-admin" class="hidden-section space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-red-600 font-black uppercase italic text-sm">Admin Console</h2>
                <button onclick="switchTab('home')" class="text-[10px] font-bold text-sl

ate-400 underline">Exit</button>
            </div>
            <div id="admin-payouts" class="space-y-3"></div>
        </section>

    </main>

    <!-- Navigation -->
    <nav class="glass fixed bottom-0 left-0 right-0 p-3 border-t border-slate-200 flex justify-around items-center z-50">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-emerald-600 flex-1 active-tab py-2" id="nav-home">
            <i class="fa-solid fa-house-chimney"></i><span class="text-[10px] font-bold mt-1">Garden</span>
        </button>
        <button onclick="switchTab('ref')" class="flex flex-col items-center text-slate-400 flex-1 py-2" id="nav-ref">
            <i class="fa-solid fa-users"></i><span class="text-[10px] font-bold mt-1">Invite</span>
        </button>
        <button onclick="switchTab('withdraw')" class="flex flex-col items-center text-slate-400 flex-1 py-2" id="nav-withdraw">
            <i class="fa-solid fa-wallet"></i><span class="text-[10px] font-bold mt-1">Wallet</span>
        </button>
        <button onclick="adminAuth()" class="flex flex-col items-center text-slate-400 flex-1 py-2">
            <i class="fa-solid fa-user-shield"></i><span class="text-[10px] font-bold mt-1">Admin</span>
        </button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
