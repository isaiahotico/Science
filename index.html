<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampaguita Pro Miner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .mining-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 min-h-screen pb-20">

    <!-- Header / Stats Card -->
    <div class="mining-gradient p-6 pb-24 text-white">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">SAMPAGUITA <span class="font-light text-xs opacity-80 italic">PRO</span></h1>
                <p class="text-[10px] uppercase tracking-widest opacity-70">Total Users: <span id="total-users">0</span></p>
            </div>
            <div class="text-right">
                <span id="user-id-tag" class="bg-white/20 px-3 py-1 rounded-full text-xs font-mono">ID: Loading...</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-md mx-auto -mt-16 p-4 space-y-4">
        
        <!-- Balance Card -->
        <div class="glass rounded-3xl p-6 shadow-xl text-center">
            <p class="text-slate-500 text-sm font-medium">Available Balance</p>
            <h2 class="text-4xl font-black text-slate-800">₱<span id="balance">0.0000</span></h2>
            <div class="mt-4 flex gap-2">
                <button onclick="switchTab('withdraw')" class="flex-1 bg-slate-100 py-2 rounded-xl text-sm font-bold hover:bg-slate-200 transition">Withdraw</button>                <button onclick="claimMining()" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-bold shadow-lg shadow-indigo-200 hover:scale-105 transition">Claim Mining</button>
            </div>
        </div>

        <!-- Buy Section -->
        <div class="bg-white rounded-3xl p-6 shadow-md">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h3 class="font-bold text-lg">Purchase Plant</h3>
                    <p class="text-xs text-slate-400">Limit: <span id="active-count">0</span>/1000</p>
                </div>
                <div class="text-right">
                    <p class="text-xs font-bold text-indigo-600">Hourly Limit</p>
                    <p class="text-[10px]" id="ad-timer">Ads used: 0/10</p>
                </div>
            </div>
            <button onclick="buySampaguita()" class="w-full bg-emerald-500 text-white p-4 rounded-2xl font-bold flex items-center justify-center gap-3 active:scale-95 transition">
                <i class="fas fa-seedling"></i> Watch Ad to Buy
            </button>
        </div>

        <!-- Dynamic List (Mining/Referral/Withdraw) -->
        <div id="tab-content" class="space-y-4">
            <!-- Mining Plants will be injected here -->
        </div>

    </main>

    <!-- Footer Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-200 flex justify-around p-3 z-50">
        <button onclick="switchTab('home')" class="text-indigo-600 flex flex-col items-center"><i class="fas fa-home text-xl"></i><span class="text-[10px] font-bold">Home</span></button>
        <button onclick="switchTab('refer')" class="text-slate-400 flex flex-col items-center"><i class="fas fa-users text-xl"></i><span class="text-[10px] font-bold">Referral</span></button>
        <button onclick="switchTab('withdraw')" class="text-slate-400 flex flex-col items-center"><i class="fas fa-wallet text-xl"></i><span class="text-[10px] font-bold">Payout</span></button>
        <button onclick="showAdminPrompt()" class="text-slate-400 flex flex-col items-center"><i class="fas fa-lock text-xl"></i><span class="text-[10px] font-bold">Admin</span></button>
    </nav>

    <!-- Date Footer -->
    <div class="text-center text-[10px] text-slate-400 pb-24" id="footer-date"></div>

    <script src="app.js"></script>
</body>
</html>
