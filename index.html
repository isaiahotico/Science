<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>
    
    <link rel="stylesheet" href="style.css"> <!-- Optional for external CSS -->
    <style>
        :root { --primary: #fbc02d; --secondary: #333; --bg: #fffde7; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; text-align: center; }
        #header { background: var(--secondary); color: white; padding: 15px; position: sticky; top: 0; z-index: 1000; border-bottom: 4px solid var(--primary); }
        .page { display: none; padding: 15px; }
        .active { display: block; }
        .btn { background: var(--primary); border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 10px auto; width: 90%; box-shadow: 0 4px #f57f17; display: block; }
        .btn:disabled { background: #ccc; box-shadow: 0 4px #999; }
        .card { background: white; border: 2px solid var(--primary); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        input { width: 85%; padding: 12px; margin: 8px; border-radius: 8px; border: 1px solid #ccc; }
        .table-container { overflow-x: auto; background: white; border-radius: 8px; margin-top: 10px; }
        table { width: 100%; font-size: 11px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .cooldown { font-size: 12px; color: #e65100; font-weight: bold; }
        .claim-btn { background: #4caf50 !important; color: white !important; display: none; }
        .status-paid { color: green; font-weight: bold; }
        .status-denied { color: red; font-weight: bold; }
        .status-pending { color: orange; font-weight: bold; }
    </style>
</head>
<body>

<div id="header">
    <div id="userBar">👤 User: Guest</div>    <div id="balanceDisplay">💰 PHP 0.000</div>
</div>

<h1 style="color: #5d4037;">PAPERHOUSE INC</h1>

<!-- MAIN NAVIGATION -->
<div id="homePage" class="page active">
    <button class="btn" onclick="showPage('adsAreaPage')">🍍 ADS AREA 🍍</button>
    <button class="btn" onclick="showPage('signInPage')">🍍 Sign In 🍍</button>
    <button class="btn" onclick="showPage('giftPage')">🍍 Gift Area 🍍</button>
    <button class="btn" onclick="showPage('referralPage')" style="background:#03a9f4;color:white">👥 Referral</button>
    <button class="btn" onclick="showPage('withdrawPage')" style="background:#4caf50;color:white">💰 Withdraw</button>
    <button class="btn" onclick="checkAdmin()" style="background:#607d8b;color:white;margin-top:20px">🛠 Owner</button>
</div>

<!-- TASK PAGES (Structure is similar) -->
<div id="adsAreaPage" class="page">
    <div class="card"><button class="btn" id="btn_task1" onclick="runTask(1, 10276123, 0.02)">Watch Ad 1</button><button class="btn claim-btn" id="claim_task1" onclick="claimReward(1)">CLAIM 0.02</button><div class="cooldown" id="timer_task1"></div></div>
    <button class="btn" onclick="showPage('homePage')">⬅ Back</button>
</div>

<!-- REFERRAL PAGE -->
<div id="referralPage" class="page">
    <div class="card">
        <p>Your ID: <b id="myRefId">...</b></p>
        <input type="text" id="inviterInput" placeholder="Inviter Username">
        <button class="btn" onclick="linkReferral()">Link Inviter</button>
        <p>Invites: <span id="refCount">0</span> | Total Earned: <span id="refEarned">0.00</span></p>
    </div>
    <button class="btn" onclick="showPage('homePage')">⬅ Back</button>
</div>

<!-- WITHDRAW PAGE -->
<div id="withdrawPage" class="page">
    <div class="card">
        <input type="number" id="wAmount" placeholder="Amount PHP">
        <input type="text" id="wInfo" placeholder="GCash/Email">
        <button class="btn" onclick="handleWithdraw()">Submit Request</button>
    </div>
    <h3>History</h3>
    <div id="historyTable" class="table-container"></div>
    <button class="btn" onclick="showPage('homePage')">⬅ Back</button>
</div>

<!-- ADMIN PAGE -->
<div id="adminPage" class="page">
    <div class="card" style="background:#222;color:white">Total Global: <h2 id="globalStats">0.00</h2></div>
    <h3>Pending</h3>
    <div id="adminPending" class="table-container"></div>
    <h3>History (Last 100)</h3>
    <div id="adminHistory" class="table-container"></div>
    <button class="btn" onclick="showPage('homePage')">⬅ Close</button>
</div>

<script src="app.js"></script>
</body>
</html>
