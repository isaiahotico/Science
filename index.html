<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>PAPERHOUSE INC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Monetag SDKs -->
    <script async src="//libtl.com/sdk.js" data-zone="10276123" data-sdk="show_10276123"></script>
    <script async src="//libtl.com/sdk.js" data-zone="10337795" data-sdk="show_10337795"></script>
    <script async src="//libtl.com/sdk.js" data-zone="10337853" data-sdk="show_10337853"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 10px; color: #333; }
        .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        #userBar { background: #2c3e50; color: #fff; padding: 12px; border-radius: 10px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; }
        #balanceDisplay { font-size: 2.2em; color: #27ae60; font-weight: 900; margin: 5px 0; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: 700; margin: 6px 0; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-main { background: #f1c40f; color: #000; }
        .btn-task { background: #3498db; color: #fff; }
        .btn-back { background: #95a5a6; color: #fff; margin-bottom: 15px; }
        .hidden { display: none; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin: 8px 0; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; }
        .status-Paid { color: #27ae60; font-weight: 700; }
        .status-Pending { color: #e67e22; }
    </style>
</head>
<body>

<div id="userBar">
    <span id="userNameDisplay">👤 Loading...</span>
    <span id="userUid" style="font-size: 0.7em; opacity: 0.7;"></span>
</div>

<div class="card">
    <div style="font-size:.8em;color:#777">TOTAL BALANCE</div>
    <div id="balanceDisplay">₱0.000</div>
</div>

<!-- PAGES -->
<div id="page-main">
    <button class="btn btn-main" onclick="showPage('ads')">🍍 ADS AREA</button>    <button class="btn btn-main" onclick="showPage('signin')">📅 DAILY SIGN-IN</button>
    <button class="btn btn-main" onclick="showPage('referral')">👥 REFERRAL</button>
    <button class="btn btn-main" onclick="showPage('withdraw')">💸 WITHDRAW</button>
</div>

<div id="page-ads" class="hidden">
    <button class="btn btn-back" onclick="showPage('main')">⬅ Back</button>
    <div class="card">
        <h3>Watch & Earn</h3>
        <button class="btn btn-task" onclick="watchAd('show_10276123')">Watch Ad 1 (₱0.05)</button>
        <button class="btn btn-task" onclick="watchAd('show_10337795')">Watch Ad 2 (₱0.05)</button>
    </div>
</div>

<div id="page-signin" class="hidden">
    <button class="btn btn-back" onclick="showPage('main')">⬅ Back</button>
    <div class="card" style="text-align:center">
        <h3>Daily Rewards</h3>
        <p>Claim your daily bonus!</p>
        <button id="signInBtn" class="btn btn-task" onclick="dailySignIn()">Claim Daily ₱1.00</button>
    </div>
</div>

<div id="page-referral" class="hidden">
    <button class="btn btn-back" onclick="showPage('main')">⬅ Back</button>
    <div class="card">
        <p>Your Referral ID: <b id="my-ref-id">...</b></p>
        <p>Referrer: <b id="current-ref">None</b></p>
        <hr>
        <input id="ref-input" placeholder="Enter Referrer ID">
        <button class="btn btn-main" onclick="setReferrer()">Bind Referrer</button>
    </div>
</div>

<div id="page-withdraw" class="hidden">
    <button class="btn btn-back" onclick="showPage('main')">⬅ Back</button>
    <div class="card">
        <input id="wd-amt" type="number" placeholder="Amount ₱">
        <input id="wd-addr" placeholder="GCash Number / Wallet Address">
        <select id="wd-method">
            <option value="GCash">GCash</option>
            <option value="FaucetPay">FaucetPay</option>
        </select>
        <button class="btn btn-main" onclick="handleWithdraw()">Submit Withdrawal</button>
    </div>
    <div id="wd-history" class="card">
        <h4>History</h4>
        <table id="historyTable">
            <thead><tr><th>Amt</th><th>Method</th><th>Status</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
