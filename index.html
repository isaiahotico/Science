<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampaguita Mining Elite</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Compat SDKs to maintain modular configuration with older-style code -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- External Ad SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .plant-card { border-left: 4px solid #10b981; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="pb-28">

    <!-- Header Stats -->
    <header class="glass-panel sticky top-0 z-50 px-4 py-4 flex justify-between items-center border-b border-slate-800">
        <div>
            <h1 class="font-extrabold text-emerald-400 text-lg tracking-wider flex items-center gap-1">
                <i class="fas fa-seedling animate-bounce"></i> SAMPAGUITA PRO
            </h1>
            <p class="text-[10px] text-slate-400 font-mono" id="user-id-display">UID: Loading...</p>
        </div>
        <div class="text-right">
            <p class="text-[9px] uppercase font-bold text-slate-500">Global Registrations</p>
            <p class="font-bold text-emerald-400 text-sm" id="global-count">0 Users</p>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Balance Dashboard -->
        <div class="bg-gradient-to-br from-emerald-500 via-teal-600 to-cyan-700 rounded-[2rem] p-6 text-white shadow-xl shadow-emerald-950/20">
            <div class="flex justify-between items-start mb-4">
                <span class="text-xs uppercase tracking-widest opacity-80 font-bold">Unclaimed Balance</span>                <i class="fas fa-wallet text-xl opacity-60"></i>
            </div>
            <div class="flex items-baseline gap-1">
                <span class="text-3xl font-extrabold">₱</span>
                <span class="text-5xl font-black tracking-tight" id="main-balance">0.00000</span>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="switchTab('withdraw')" class="flex-1 bg-white/10 hover:bg-white/20 py-3 rounded-2xl text-xs font-bold transition">Withdraw</button>
                <button onclick="buySampaguita()" class="flex-1 bg-emerald-400 hover:bg-emerald-300 text-slate-950 py-3 rounded-2xl text-xs font-black shadow-lg shadow-emerald-500/20 active:scale-95 transition">
                    <i class="fas fa-plus-circle mr-1"></i> BUY PLANT (ADS)
                </button>
            </div>
        </div>

        <!-- Limits Information -->
        <div class="grid grid-cols-2 gap-4">
            <div class="glass-panel rounded-2xl p-3 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold mb-0.5">Garden Capacity</p>
                <p class="text-sm font-extrabold text-emerald-400" id="capacity-counter">0 / 500 Plants</p>
            </div>
            <div class="glass-panel rounded-2xl p-3 text-center">
                <p class="text-[9px] text-slate-400 uppercase font-bold mb-0.5">Ad Usage (Hour)</p>
                <p class="text-sm font-extrabold text-amber-400" id="ad-limit-counter">0 / 10 Used</p>
            </div>
        </div>

        <!-- Header of Active Tab -->
        <div id="dynamic-title" class="px-1 flex justify-between items-end">
            <div>
                <h2 class="font-extrabold text-slate-200 text-lg">My Greenhouse</h2>
                <p class="text-xs text-slate-400" id="plant-stats">0 Active Plants</p>
            </div>
        </div>

        <!-- Content Area -->
        <div id="content-area" class="space-y-4">
            <!-- Dynamic garden/referral/wallet content injected here -->
            <div class="text-center py-20">
                <i class="fas fa-spinner fa-spin text-3xl text-emerald-500 mb-3"></i>
                <p class="text-slate-400 text-xs">Synchronizing securely with database...</p>
            </div>
        </div>

    </main>

    <!-- Bottom Menu Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass-panel border-t border-slate-800/80 flex justify-around p-4 z-50">
        <button onclick="switchTab('home')" class="nav-btn text-emerald-400 transition transform hover:scale-110"><i class="fas fa-leaf text-2xl"></i></button>
        <button onclick="switchTab('refer')" class="nav-btn text-slate-500 transition transform hover:scale-110"><i class="fas fa-users text-2xl"></i></button>
        <button onclick="switchTab('withdraw')" class="nav-btn text-slate-500 transition transform hover:scale-110"><i class="fas fa-wallet text-2xl"></i></button>
        <button onclick="adminLogin()" class="nav-btn text-slate-500 transition transform hover:scale-110"><i class="fas fa-user-shield text-2xl"></i></button>
    </nav>

    <footer class="text-center mt-4">
        <p class="text-[10px] text-slate-500 tracking-wider" id="realtime-clock">Fetching global time...</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
