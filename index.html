<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC - MAX REVENUE</title>
    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    <script src="https://inapp.telega.io/sdk/v1/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .accent-gold { color: #fbbf24; }
        .nav-active { color: #fbbf24; border-top: 2px solid #fbbf24; }
        .popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .btn-disabled { filter: grayscale(1); opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="p-5 flex justify-between items-center glass sticky top-0 z-50">
        <div>
            <h1 class="text-[10px] font-black tracking-widest text-slate-500 uppercase">PAPERHOUSE INC.</h1>
            <p id="tg-username" class="text-lg font-bold accent-gold italic">@User</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-slate-500 font-bold uppercase">Balance</p>
            <p class="text-2xl font-black text-white">₱ <span id="balance">0.0000</span></p>
        </div>
    </header>

    <!-- EARN PAGE -->
    <div id="earn" class="page active p-4 space-y-4">
        <div class="glass p-8 rounded-3xl text-center relative overflow-hidden">
            <div id="cooldown-box" class="absolute top-0 left-0 h-1 bg-yellow-500 w-0 transition-all duration-1000"></div>
            <h2 class="text-xl font-bold mb-1">Drive Carefully Now</h2>                    <p id="totalInvites" class="text-2xl font-bold">0</p>
                </div>
                <div class="bg-slate-800/50 p-4 rounded-2xl text-center">
                    <p class="text-[10px] text-slate-500 uppercase">Earned</p>
                    <p id="totalRefEarned" class="text-2xl font-bold text-green-400">₱0.00</p>
                </div>
            </div>
        </div>

        <div class="glass p-6 rounded-3xl">
            <h3 class="text-sm font-bold mb-3 italic">Redeem Partner Code</h3>
            <input type="text" id="inputCode" placeholder="6-LETTER CODE" class="w-full bg-slate-900 p-4 rounded-2xl text-center font-mono uppercase tracking-widest mb-3 border border-slate-800">
            <button onclick="applyRef()" id="applyBtn" class="w-full bg-white text-black font-black p-4 rounded-2xl shadow-xl">ACTIVATE</button>
        </div>
    </div>

    <!-- LEADERBOARD -->
    <div id="leaderboard" class="page p-4">
        <h2 class="text-xl font-black mb-4 italic uppercase">Elite Top 100</h2>
        <div id="leader-list" class="space-y-2"></div>
    </div>

    <!-- WALLET -->
    <div id="wallet" class="page p-4">
        <div class="glass p-6 rounded-3xl mb-4">
            <h2 class="text-xl font-bold mb-4">Withdraw to GCash</h2>
            <input type="number" id="wd-acc" placeholder="GCash Number (09...)" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl mb-3">
            <input type="number" id="wd-amt" placeholder="Amount (Min ₱1)" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl mb-4">
            <button onclick="requestWithdraw()" class="w-full bg-green-500 text-white p-5 rounded-2xl font-black shadow-lg">REDEEM NOW</button>
        </div>
        <div class="glass p-4 rounded-3xl">
            <h2 class="text-xs font-bold text-sky-400 mb-3 uppercase">Withdrawal History</h2>
            <div id="wd-history" class="space-y-2 text-[10px]"></div>
        </div>
    </div>

    <!-- ADMIN -->
    <div id="admin" class="page p-4">
        <div id="admin-login" class="glass p-6 rounded-3xl">
            <input type="password" id="admin-pass" placeholder="Admin Password" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl mb-3">
            <button onclick="checkAdmin()" class="w-full bg-red-600 text-white p-4 rounded-xl font-bold">Access Dashboard</button>
        </div>
        <div id="admin-content" class="hidden glass p-4 rounded-3xl">
            <h2 class="text-xl font-bold mb-4 text-red-500">Pending Withdrawals</h2>
            <div id="admin-list" class="space-y-2"></div>
        </div>
    </div>

    <!-- POPUP OVERLAYS -->
    <div id="quote-popup" class="popup-overlay">
        <div class="glass p-8 border-2 border-yellow-500 rounded-3xl max-w-sm text-center">
            <p class="text-green-400 font-black text-2xl mb-2 italic">₱0.014 CREDIT!</p>
            <p id="quote-text" class="text-slate-300 italic text-sm mb-6"></p>
            <button onclick="closePop('quote-popup')" class="w-full bg-white text-black py-3 rounded-xl font-black">CONTINUE</button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800 p-2 flex justify-around items-center z-50">
        <button onclick="showPage('earn')" id="nav-earn" class="flex flex-col items-center w-1/5 py-2 text-[9px] uppercase font-black nav-active">
            <i class="fas fa-play text-xl mb-1"></i>Earn
        </button>
        <button onclick="showPage('refer')" id="nav-refer" class="flex flex-col items-center w-1/5 py-2 text-[9px] uppercase font-black text-slate-500">
            <i class="fas fa-users text-xl mb-1"></i>Refer
        </button>
        <button onclick="showPage('leaderboard')" id="nav-leaderboard" class="flex flex-col items-center w-1/5 py-2 text-[9px] uppercase font-black text-slate-500">
            <i class="fas fa-trophy text-xl mb-1"></i>Top 100
        </button>
        <button onclick="showPage('wallet')" id="nav-wallet" class="flex flex-col items-center w-1/5 py-2 text-[9px] uppercase font-black text-slate-500">
            <i class="fas fa-wallet text-xl mb-1"></i>Wallet
        </button>
        <button onclick="showPage('admin')" id="nav-admin" class="flex flex-col items-center w-1/5 py-2 text-[9px] uppercase font-black text-slate-700">
            <i class="fas fa-lock text-xl mb-1"></i>Admin
        </button>
    </nav>

    <!-- Footer Stats -->
    <div class="fixed bottom-16 left-0 right-0 flex justify-between px-6 text-[9px] font-mono text-slate-600 pointer-events-none">
        <span id="live-time">00:00:00</span>
        <span id="live-date">MAR 04, 2026</span>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
