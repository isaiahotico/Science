<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAPERHOUSE TASKMASTER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    <script src='//libtl.com/sdk.js' data-zone='10555746' data-sdk='show_10555746'></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        body { background: #020617; color: #f8fafc; font-family: 'Outfit', sans-serif; overflow: hidden; height: 100vh; }
        .page { display: none; height: calc(100vh - 160px); overflow-y: auto; padding-bottom: 40px; }
        .page.active { display: block; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .accent-gold { color: #facc15; }
        .nav-active { color: #facc15; border-top: 3px solid #facc15; }
        .popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .web-card { display:none; position:fixed; bottom:0; left:0; width:100%; height:75%; background:white; z-index:10000; border-radius:30px 30px 0 0; overflow:hidden; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .btn-disabled { filter: grayscale(1); opacity: 0.4; pointer-events: none; }
        input, select, textarea { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; width: 100%; border-radius: 12px; padding: 12px; font-size: 14px; outline: none; }
    </style>
</head>
<body class="select-none">

    <!-- Header -->
    <header class="p-5 flex justify-between items-center glass sticky top-0 z-[100]">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 bg-yellow-400 rounded-xl flex items-center justify-center font-black text-black shadow-lg shadow-yellow-400/20">P</div>
            <div>                <h1 class="text-[9px] font-black tracking-widest text-slate-500 uppercase">Taskmaster v4</h1>
                <p id="tg-username" class="text-sm font-bold accent-gold italic">@User</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-xl font-black text-white">₱<span id="balance">0.0000</span></p>
        </div>
    </header>

    <!-- MAIN APP -->
    <main>
        <!-- EARN PAGE -->
        <div id="earn" class="page active p-4 space-y-4">
            <div class="glass p-8 rounded-[2.5rem] text-center relative overflow-hidden border border-yellow-500/10">
                <div id="cooldown-box" class="absolute top-0 left-0 h-1 bg-yellow-400 w-0 transition-all duration-1000"></div>
                <h2 class="text-xl font-black mb-1 italic">MAIN AD BUNDLE</h2>
                <button id="adBtn" onclick="fireAdChain('bundle')" class="w-full bg-yellow-400 text-black py-5 rounded-2xl font-black text-xl mt-4 active:scale-95 transition-all">START ₱0.024 BUNDLE</button>
                <p id="timer-text" class="text-[10px] mt-4 font-black text-yellow-500 h-4 uppercase"></p>
            </div>

            <div class="glass p-4 rounded-[2rem] flex flex-col h-[350px]">
                <div id="chat-box" class="flex-1 overflow-y-auto p-2 space-y-2 text-[12px]"></div>
                <div class="mt-2 flex gap-2">
                    <input type="text" id="chatInput" placeholder="Message..." class="flex-1">
                    <button onclick="sendMsg()" class="bg-white text-black px-4 rounded-xl font-black">SEND</button>
                </div>
            </div>
        </div>

        <!-- TASK PAGE -->
        <div id="tasks" class="page p-4 space-y-4">
            <div class="flex gap-2">
                <button onclick="switchTaskTab('fb')" id="tab-fb" class="flex-1 p-3 rounded-xl bg-blue-600 font-black text-xs">FB FOLLOWS</button>
                <button onclick="switchTaskTab('web')" id="tab-web" class="flex-1 p-3 rounded-xl glass font-black text-xs">WEB VISITS</button>
                <button onclick="showTaskForm()" class="p-3 rounded-xl bg-green-600 font-black text-xs"><i class="fas fa-plus"></i></button>            </div>

            <div id="task-list" class="space-y-3">
                <!-- Tasks Load Here -->
            </div>
        </div>

        <!-- REFERRAL PAGE -->
        <div id="refer" class="page p-4">
            <div class="glass p-8 rounded-[2.5rem] text-center border border-blue-500/20">
                <h2 class="text-xl font-black accent-gold mb-2">PARTNER PROGRAM</h2>
                <div class="bg-black/40 p-6 rounded-3xl mb-4 font-mono text-2xl tracking-widest" id="myCode">------</div>
                <div class="grid grid-cols-2 gap-2 text-xs font-bold">
                    <div class="glass p-4 rounded-2xl">SLOTS: <span id="totalInvites">0</span>/12</div>
                    <div class="glass p-4 rounded-2xl text-green-400">PROFIT: <span id="totalRefEarned">₱0.00</span></div>
                </div>
                <div class="mt-6">
                    <input type="text" id="inputCode" placeholder="Enter Invite Code" class="text-center mb-2">
                    <button onclick="applyRef()" id="applyBtn" class="w-full bg-white text-black font-black p-4 rounded-xl">LINK PARTNER</button>
                </div>
            </div>
        </div>

        <!-- WALLET PAGE -->
        <div id="wallet" class="page p-4">
            <div class="glass p-6 rounded-[2.5rem] space-y-4">
                <select id="wd-method" onchange="updateWalletLabels()">
                    <option value="gcash">GCASH</option>
                    <option value="paypal">PAYPAL (GMAIL)</option>
                    <option value="faucetpay">FAUCETPAY (GMAIL)</option>
                </select>
                <input type="text" id="wd-acc" placeholder="09xxxxxxxxx">
                <input type="number" id="wd-amt" placeholder="Amount (₱)">
                <button onclick="requestWithdraw()" class="w-full bg-green-500 text-white p-5 rounded-2xl font-black">WITHDRAW</button>
            </div>
            <div id="user-wd-history" class="mt-4 space-y-2"></div>
        </div>

        <!-- ADMIN PAGE -->
        <div id="admin" class="page p-4">
            <div id="admin-login" class="glass p-6 rounded-3xl text-center">
                <input type="password" id="admin-pass" placeholder="System Code" class="text-center mb-3">
                <button onclick="checkAdmin()" class="w-full bg-red-600 p-4 rounded-xl font-black">LOGIN</button>
            </div>
            <div id="admin-content" class="hidden space-y-4">
                <button onclick="createAdminTask()" class="w-full bg-blue-600 p-4 rounded-xl font-black italic">+ CREATE 100K CAPACITY TASK</button>
                <div id="admin-list" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <!-- MODALS -->
    <div id="task-modal" class="popup-overlay">
        <div class="glass p-6 rounded-[2.5rem] w-full max-w-sm">
            <h2 class="text-lg font-black mb-4">PROMOTE LINK</h2>
            <p class="text-[10px] text-slate-400 mb-4 font-bold">COST: ₱2.00 FOR 100 VISITS</p>
            <div class="space-y-3">
                <select id="task-type-input">
                    <option value="fb">FB FOLLOW/LIKE</option>
                    <option value="web">WEBSITE VISIT</option>
                </select>
                <input type="text" id="task-link" placeholder="https://...">
                <textarea id="task-desc" placeholder="Task Definition (e.g. Please follow my page)"></textarea>
                <button onclick="buyTask()" class="w-full bg-yellow-400 text-black p-4 rounded-xl font-black">PURCHASE TASK</button>
                <button onclick="closePop('task-modal')" class="w-full p-2 text-xs text-slate-500 font-bold">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- WEB VIEW CARD -->
    <div id="web-view" class="web-card">
        <div class="bg-slate-100 p-3 flex justify-between items-center border-b">
            <span class="text-black font-black text-xs">VISIT SITE (Click 2 Times)</span>
            <button onclick="closeWebCard()" class="text-red-500 font-black">CLOSE</button>
        </div>
        <iframe id="task-iframe" src="" class="w-full h-full border-none"></iframe>
    </div>

    <div id="quote-popup" class="popup-overlay">
        <div class="glass p-8 rounded-[3rem] text-center border border-yellow-500/30">
            <p class="text-green-400 font-black text-2xl italic">SUCCESS!</p>
            <p id="quote-text" class="text-slate-200 italic text-sm my-6 px-2"></p>
            <button onclick="closePop('quote-popup')" class="w-full bg-white text-black py-4 rounded-2xl font-black">CONTINUE</button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/5 p-4 flex justify-around items-center z-[100] rounded-t-[2.5rem]">
        <button onclick="showPage('earn')" id="nav-earn" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black uppercase nav-active"><i class="fas fa-bolt text-lg mb-1"></i>Earn</button>
        <button onclick="showPage('tasks')" id="nav-tasks" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black uppercase text-slate-500"><i class="fas fa-tasks text-lg mb-1"></i>Tasks</button>
        <button onclick="showPage('refer')" id="nav-refer" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black uppercase text-slate-500"><i class="fas fa-link text-lg mb-1"></i>Link</button>
        <button onclick="showPage('wallet')" id="nav-wallet" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black uppercase text-slate-500"><i class="fas fa-wallet text-lg mb-1"></i>Cash</button>
        <button onclick="showPage('admin')" id="nav-admin" class="flex flex-col items-center w-1/5 py-2 text-[9px] font-black uppercase text-slate-900"><i class="fas fa-lock text-lg mb-1"></i>Root</button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
