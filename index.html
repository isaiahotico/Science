<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PAPERHOUSE INC</title>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Monetag SDKs (async = no freeze) -->
<script async src="//libtl.com/sdk.js" data-zone="10276123" data-sdk="show_10276123"></script>
<script async src="//libtl.com/sdk.js" data-zone="10337795" data-sdk="show_10337795"></script>
<script async src="//libtl.com/sdk.js" data-zone="10337853" data-sdk="show_10337853"></script>

<style>
*{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Segoe UI;background:#f4f7f6;padding:10px}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
#userBar{background:#2c3e50;color:#fff;padding:12px;border-radius:10px;font-weight:700;margin-bottom:10px}
#balanceDisplay{font-size:2.2em;color:#27ae60;font-weight:900}
.btn{width:100%;padding:15px;border-radius:10px;border:none;font-weight:700;margin:6px 0;cursor:pointer}
.btn-main{background:#f1c40f}
.btn-task{background:#3498db;color:#fff}
.btn-claim{background:#e67e22;color:#fff;display:none}
.hidden{display:none}
.cooldown{color:#e74c3c;font-size:.8em;font-weight:700}
input,select{width:95%;padding:12px;border-radius:8px;border:1px solid #ddd;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:.8em}
th,td{border:1px solid #eee;padding:8px}
.status-Paid{color:#27ae60;font-weight:700}

/* 🔥 CRITICAL FIX */
iframe,.sdk-overlay{pointer-events:none!important}
</style>
</head>

<body>

<div id="userBar">👤 Loading...</div>

<div class="card">
<div style="font-size:.8em;color:#777">TOTAL BALANCE</div>
<div id="balanceDisplay">₱0.000</div>
</div>

<!-- MAIN -->
<div id="page-main">
<button class="btn btn-main" onclick="go('ads')">🍍 ADS AREA</button>
<button class="btn btn-main" onclick="go('signin')">🍍 SIGN IN</button>
<button class="btn btn-main" onclick="go('gifts')">🍍 GIFTS</button>
<button class="btn btn-main" onclick="go('referral')">👥 REFERRAL</button>
<button class="btn btn-main" onclick="go('withdraw')">💸 WITHDRAW</button>
<button class="btn btn-main" onclick="adminAuth()">⚙️ ADMIN</button>
</div>

<div id="ads" class="hidden"></div>
<div id="signin" class="hidden"></div>
<div id="gifts" class="hidden"></div>

<div id="referral" class="hidden">
<button onclick="go('main')">⬅ Back</button>
<div class="card">
<p>Your Username: <b id="my-ref-id"></b></p>
<p>Referrer: <b id="current-ref">None</b></p>
<input id="ref-input" placeholder="@username">
<button class="btn btn-main" onclick="setReferrer()">Bind Referrer</button>
</div>
</div>

<div id="withdraw" class="hidden">
<div class="card">
<input id="wd-amt" type="number" placeholder="Amount ₱">
<input id="wd-addr" placeholder="GCash / FaucetPay">
<select id="wd-method"><option>GCash</option><option>FaucetPay</option></select>
<button class="btn btn-main" onclick="handleWD()">Submit</button>
</div>
<div id="wd-history"></div>
</div>

<div id="admin" class="hidden">
<div id="admin-table"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
