<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10276123' data-sdk='show_10276123'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337795' data-sdk='show_10337795'></script>
    <script src='//libtl.com/sdk.js' data-zone='10337853' data-sdk='show_10337853'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { --gold: #ffd700; --green: #2ecc71; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .header { background: var(--card); padding: 15px; border-radius: 15px; border-bottom: 3px solid var(--gold); text-align: center; margin-bottom: 15px; }
        h1 { color: var(--gold); margin: 0; font-size: 1.4rem; letter-spacing: 2px; }
        .balance { font-size: 2.5rem; color: var(--green); font-weight: bold; margin: 5px 0; }
        .global-stat { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        button { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .btn-main { background: var(--gold); color: black; }
        .btn-task { background: var(--green); color: white; }
        .btn-bonus { background: #9b59b6; color: white; }
        .btn-withdraw { background: #e74c3c; color: white; }
        
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .hidden { display: none; }
        .cooldown { font-size: 0.8rem; color: #ff7675; text-align: center; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        table { width: 100%; font-size: 11px; margin-top: 10px; border-collapse: collapse; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        .status-Paid { color: var(--green); font-weight: bold; }
        .status-Pending { color: var(--gold); }
        .status-Denied { color: #ff7675; }
    </style>
</head>
<body>

<div class="header">
    <h1>PAPERHOUSE INC</h1>    <div id="userLabel" style="color: #0088cc; font-size: 0.8rem; margin-top: 5px;">👤 User: ...</div>
    <div class="balance">₱<span id="mainBalance">0.000</span></div>
    <div class="global-stat">Total Withdrawn by Users: ₱<span id="globalWithdrawn">0.00</span></div>
</div>

<div id="page-main">
    <button class="btn-main" onclick="navTo('page-ads')">🍍ADS AREA🍍</button>
    <button class="btn-main" onclick="navTo('page-signin')">🍍Paper house Sign In🍍</button>
    <button class="btn-main" onclick="navTo('page-gift')">🍍Paper house Gift🍍</button>
    <button class="btn-bonus" onclick="navTo('page-bonus')">🍍RANDOM BONUS (5 TASKS)🍍</button>
    <button class="btn-withdraw" onclick="navTo('page-withdraw')">Withdraw your Money here</button>
    <button style="background:#333; color:#777; font-size: 10px;" onclick="openAdmin()">Owner Dashboard</button>
</div>

<!-- Task Pages -->
<div id="page-ads" class="hidden"><button onclick="navTo('page-main')">⬅ Back</button><div id="cont-ads"></div></div>
<div id="page-signin" class="hidden"><button onclick="navTo('page-main')">⬅ Back</button><div id="cont-signin"></div></div>
<div id="page-gift" class="hidden"><button onclick="navTo('page-main')">⬅ Back</button><div id="cont-gift"></div></div>
<div id="page-bonus" class="hidden"><button onclick="navTo('page-main')">⬅ Back</button><h3>Surprise Bonus Ads</h3><div id="cont-bonus"></div></div>

<!-- Withdrawal Page -->
<div id="page-withdraw" class="hidden">
    <button onclick="navTo('page-main')">⬅ Back</button>
    <div class="card">
        <h3>Request Payout</h3>
        <input type="text" id="payMethod" placeholder="Method (GCash / FaucetPay)">
        <input type="text" id="payInfo" placeholder="Number or Email">
        <button class="btn-task" onclick="handleWithdrawal()">Submit Request</button>
    </div>
    <h4>Live History</h4>
    <table id="userHistTable">
        <thead><tr><th>Method</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody id="userHistBody"></tbody>
    </table>
</div>

<!-- Owner Dashboard -->
<div id="page-admin" class="hidden">
    <button onclick="navTo('page-main')">Logout Admin</button>
    <h3>Pending Approvals (Live Sync)</h3>
    <table style="font-size: 10px;">
        <thead><tr><th>User</th><th>Amount</th><th>Details</th><th>Action</th></tr></thead>
        <tbody id="adminBody"></tbody>
    </table>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
