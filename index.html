
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- Monetag Scripts (Place your actual Monetag SDK tags here) -->
    <script src='//thubanoa.com/aufe/v1/metatag.js?6294726'></script>
    <script src="https://alwingulla.com/88/p.js"></script>

    <style>
        body {
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border: 2px solid;
            border-image: linear-gradient(135deg, #BF953F, #FCF6BA, #AA771C) 1;
        }
        .gold-btn {
            background: linear-gradient(135deg, #BF953F, #FCF6BA, #AA771C);
            color: #000;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(184, 134, 11, 0.4);
        }
        .gold-btn:disabled {
            background: #444;
            color: #888;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .shining-text {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body class="p-4">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-extrabold gold-gradient shining-text">🎖PAPERHOUSE INC🎖</h1>
        <p class="text-xs text-yellow-500 uppercase tracking-widest">Premium Rewards Portal</p>
    </div>

    <!-- Balance Section -->
    <div class="card p-6 mb-6 text-center gold-border">
        <p class="text-gray-400 text-sm">Total Balance</p>
        <h2 class="text-4xl font-bold text-white">₱ <span id="balance">0.000</span></h2>

        <p class="text-xs mt-2 text-yellow-600">Minimum Withdrawal: ₱1.00</p>
    </div>

    <!-- Navigation -->
    <div class="flex justify-around mb-6 text-sm">
        <button onclick="showView('ads')" class="text-yellow-500 font-bold border-b-2 border-yellow-500 pb-1">ADS SECTION</button>
        <button onclick="showView('withdraw')" class="text-gray-400">WITHDRAW</button>
        <button onclick="showView('admin')" class="text-gray-400">OWNER</button>
    </div>

    <!-- ADS SECTION -->
    <div id="view-ads" class="space-y-4">
        <h3 class="text-center text-yellow-500 mb-4">🎖🎉ADS🤑SECTION🎉🎖</h3>
        
        <button id="btn-gift1" onclick="handleAd('gift1')" class="gold-btn w-full py-4 rounded-xl shadow-lg">
            🎖🎉GIFT1🎉🎖<br><span class="text-xs">Reward: ₱0.075 (15m)</span>
        </button>

        <button id="btn-gift2" onclick="handleAd('gift2')" class="gold-btn w-full py-4 rounded-xl shadow-lg">
            🎖🎉GIFT2🎉🎖<br><span class="text-xs">Reward: ₱0.075 (15m)</span>
        </button>

        <button id="btn-gift3" onclick="handleAd('gift3')" class="gold-btn w-full py-4 rounded-xl shadow-lg">
            🎖🎉GIFT3🎉🎖<br><span class="text-xs">Reward: ₱0.075 (15m)</span>
        </button>

        <div class="py-4"></div>

        <button id="btn-premium" onclick="handleAd('premium')" class="bg-red-700 text-white border-2 border-yellow-500 w-full py-5 rounded-xl font-bold italic animate-pulse">
            🎖PREMIUM🎉ADS🎖<br><span class="text-xs">3X Reward: ₱0.022 (5m)</span>
        </button>
    </div>

    <!-- WITHDRAW SECTION -->
    <div id="view-withdraw" class="hidden space-y-4">
        <div class="card p-4">
            <h3 class="text-yellow-500 font-bold mb-2">GCASH WITHDRAWAL</h3>
            <input type="number" id="withdraw-amount" placeholder="Amount (Min 1.00)" class="w-full bg-black border border-yellow-800 p-2 rounded mb-2 outline-none">
            <input type="text" id="gcash-num" placeholder="GCash Number (09...)" class="w-full bg-black border border-yellow-800 p-2 rounded mb-4 outline-none">
            <button onclick="requestWithdrawal()" class="gold-btn w-full py-2 rounded">SUBMIT REQUEST</button>
        </div>

        <div class="mt-6">
            <h4 class="text-xs text-yellow-600 mb-2 uppercase">Your Withdrawal History</h4>
            <div class="overflow-x-auto text-[10px]">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b border-yellow-900">
                            <th class="p-2 text-yellow-500">Date</th>
                            <th class="p-2 text-yellow-500">Amount</th>
                            <th class="p-2 text-yellow-500">Status</th>
                        </tr>
                    </thead>
                    <tbody id="user-history-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ADMIN SECTION -->
    <div id="view-admin" class="hidden space-y-4">
        <div id="admin-login" class="card p-4">
            <input type="password" id="admin-pass" placeholder="Owner Password" class="w-full bg-black border border-yellow-800 p-2 rounded mb-2">
            <button onclick="loginAdmin()" class="gold-btn w-full py-2 rounded text-sm">ACCESS DASHBOARD</button>
        </div>

        <div id="admin-dashboard" class="hidden">
            <h3 class="text-yellow-500 font-bold mb-4">PENDING REQUESTS</h3>
            <div id="pending-list" class="space-y-2 text-xs"></div>
            
            <h3 class="text-green-500 font-bold mt-8 mb-4">APPROVED HISTORY</h3>
            <div class="overflow-x-auto text-[10px]">
                <table class="w-full text-left">
                    <tbody id="admin-approved-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
