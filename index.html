
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampaguita Garden - Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Ad Zones -->
    <script src="https://libtl.com/sdk.js" data-zone="10555663" data-sdk="show_10555663"></script>
    <script src="https://libtl.com/sdk.js" data-zone="10555746" data-sdk="show_10555746"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
        .hidden-section { display: none !important; }
        .nav-active { color: #10b981 !important; border-top: 3px solid #10b981; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="pb-24">

    <!-- Header / Global Stats -->
    <header class="glass sticky top-0 z-50 p-4 shadow-sm">
        <div class="max-w-xl mx-auto flex justify-between items-end">
            <div>
                <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Total Registered Users: <span id="global-users" class="text-emerald-600">...</span></p>
                <div class="flex items-center gap-1">
                    <span class="text-xl font-bold text-emerald-600">₱</span>
                    <span id="main-bal" class="text-3xl font-black font-mono">0.00000000</span>
                </div>
            </div>
            <div class="text-right">
                <span id="uid-tag" class="text-[9px] bg-slate-800 text-white px-2 py-1 rounded font-mono">ID: ...</span>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-6">

        <!-- User Analytics Grid -->
        <div class="grid grid-cols-3 gap-2">
            <div class="glass p-3 rounded-2xl text-center">
                <p class="text-[9px] font-bold text-slate-400 uppercase">My Referrals</p>
                <p id="stat-refs" class="text-lg font-black">0</p>
            </div>

            <div class="glass p-3 rounded-2xl text-center border-emerald-100">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Ref Income</p>
                <p id="stat-ref-inc" class="text-lg font-black text-emerald-600">₱0.00</p>
            </div>
            <div class="glass p-3 rounded-2xl text-center">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Garden Space</p>
                <p id="stat-garden" class="text-lg font-black">0/500</p>
            </div>
        </div>

        <!-- Section: Garden Table -->
        <section id="sec-home">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-black text-slate-800 uppercase tracking-tighter">My Flowers</h2>
                <button onclick="buyFlower()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-[10px] font-black shadow-lg shadow-emerald-200 active:scale-95 transition">
                    + PLANT (AD 746)
                </button>
            </div>

            <div class="glass rounded-2xl overflow-hidden shadow-sm">
                <table class="w-full text-left text-[11px]">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-500">
                        <tr>
                            <th class="px-4 py-3 font-bold"># ID</th>
                            <th class="px-4 py-3 font-bold">ACCUMULATED</th>
                            <th class="px-4 py-3 font-bold text-right">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="garden-tbody">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
                <!-- Pagination Controls -->
                <div class="p-3 bg-slate-50 flex justify-between items-center border-t border-slate-200">
                    <button onclick="changePage(-1)" class="px-3 py-1 bg-white border rounded shadow-sm text-[10px] font-bold">Prev</button>
                    <span id="page-info" class="text-[10px] font-bold text-slate-500 uppercase">Page 1 / 1</span>
                    <button onclick="changePage(1)" class="px-3 py-1 bg-white border rounded shadow-sm text-[10px] font-bold">Next</button>
                </div>
            </div>
            <p class="text-center text-[9px] font-bold text-slate-400 mt-2 uppercase">Limit: 10 plants per hour | Total Max: 500</p>
        </section>

        <!-- Section: Referrals -->
        <section id="sec-ref" class="hidden-section space-y-4">
            <div class="bg-slate-900 p-6 rounded-[2rem] text-white">
                <h3 class="text-lg font-black">Referral Center</h3>
                <p class="text-[11px] opacity-60 mb-4">Your friends' claim activities earn you 5% commission.</p>
                <div class="bg-white/10 p-4 rounded-2xl flex justify-between items-center border border-white/5">
                    <span id="ref-code" class="text-xl font-mono font-bold tracking-widest text-emerald-400">------</span>
                    <button onclick="copyRef()" class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Copy</button>
                </div>
            </div>
            <div class="glass p-5 rounded-3xl flex gap-2">
                <input id="ref-input" type="text" placeholder="Invite Code" class="flex-1 bg-slate-100 p-3 rounded-xl border-none text-xs font-bold uppercase outline-none">
                <button onclick="bindRef()" class="bg-slate-800 text-white px-6 rounded-xl text-xs font-bold">BIND</button>
            </div>
        </section>

        <!-- Section: Wallet

-->
        <section id="sec-wallet" class="hidden-section space-y-4">
            <div class="glass p-6 rounded-[2rem] space-y-4">
                <h3 class="font-black">Withdrawal</h3>
                <div class="space-y-3">
                    <select id="wd-method" class="w-full p-3.5 rounded-xl bg-slate-100 text-xs font-bold outline-none">
                        <option value="GCash">GCash</option>
                        <option value="FaucetPay">FaucetPay</option>
                    </select>
                    <input id="wd-dest" type="text" placeholder="Account Number" class="w-full p-3.5 rounded-xl bg-slate-100 text-xs font-bold outline-none">
                    <input id="wd-amt" type="number" placeholder="Amount (Min 1.00)" class="w-full p-3.5 rounded-xl bg-slate-100 text-xs font-bold outline-none">
                    <button onclick="submitWD()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs shadow-lg uppercase">Request Cashout</button>
                </div>
            </div>
            <div id="wd-history" class="space-y-2"></div>
        </section>

        <!-- Section: Admin -->
        <section id="sec-admin" class="hidden-section space-y-4">
            <div id="admin-list" class="space-y-3"></div>
        </section>

    </main>

    <!-- Bottom Nav -->
    <nav class="glass fixed bottom-0 left-0 right-0 p-4 border-t flex justify-around items-center z-50 rounded-t-[2rem]">
        <button onclick="tab('home')" id="nav-home" class="flex flex-col items-center flex-1 nav-active">
            <i class="fa-solid fa-table-list"></i><span class="text-[9px] font-black mt-1">Garden</span>
        </button>
        <button onclick="tab('ref')" id="nav-ref" class="flex flex-col items-center flex-1 text-slate-400">
            <i class="fa-solid fa-users"></i><span class="text-[9px] font-black mt-1">Ref</span>
        </button>
        <button onclick="tab('wallet')" id="nav-wallet" class="flex flex-col items-center flex-1 text-slate-400">
            <i class="fa-solid fa-wallet"></i><span class="text-[9px] font-black mt-1">Wallet</span>
        </button>
        <button onclick="adminCheck()" class="flex flex-col items-center flex-1 text-slate-400">
            <i class="fa-solid fa-user-shield"></i><span class="text-[9px] font-black mt-1">Admin</span>
        </button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
